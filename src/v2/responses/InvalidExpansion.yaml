description: Malformed or unsupported relationship expansion
headers:
  X-Lago-Endpoint-Status:
    $ref: '../headers/EndpointStatus.yaml'
content:
  application/json:
    schema:
      $ref: '../schemas/ApiError.yaml'
    examples:
      unsupportedExpansion:
        value:
          code: expand_not_supported
          details:
            - code: not_expandable
              field: expands
              meta:
                invalid_values: [payment]
      malformedExpansion:
        value:
          code: invalid_expand
          details:
            - code: malformed
              field: expands
              meta:
                allowed_values: []
