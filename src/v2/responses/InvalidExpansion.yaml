description: Malformed, unknown or unsupported relationship expansion
headers:
  X-Lago-Endpoint-Status:
    $ref: '../headers/EndpointStatus.yaml'
content:
  application/json:
    schema:
      $ref: '../schemas/ApiError.yaml'
    examples:
      unknownExpansion:
        summary: Expansion other than payment on a receipt retrieval
        value:
          code: invalid_expand
          details:
            - code: invalid_expand
              field: expands
              meta:
                invalid_values: [customer]
                allowed_values: [payment]
      actionNotExpandable:
        summary: Expansion on an email resend
        value:
          code: expand_not_supported
          details:
            - code: action_not_expandable
              field: expands
              meta:
                invalid_values: [payment]
      malformedExpansion:
        summary: Expansion not sent as an array
        value:
          code: invalid_expand
          details:
            - code: malformed
              field: expands
              meta:
                allowed_values: [payment]
