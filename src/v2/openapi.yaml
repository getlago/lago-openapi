openapi: 3.1.0
info:
  title: Lago API v2 documentation
  description: Lago API v2. Documents native v2 endpoints for the product catalog, billing,
    customers, organizations, billing entities, billable metrics, events, logs
    and webhook endpoints. Native v2 endpoints use cursor pagination, opt-in
    relationship expansions and structured error responses. Some other /api/v2
    paths still fall back to v1 controllers and are not described here.
  version: 2.0.0-beta
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
externalDocs:
  description: Lago documentation
  url: https://getlago.com/docs
servers:
  - url: https://api.getlago.com/api/v2
    description: US Lago cluster
  - url: https://api.eu.getlago.com/api/v2
    description: EU Lago cluster
security:
