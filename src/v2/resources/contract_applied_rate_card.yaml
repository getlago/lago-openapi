parameters:
  - name: contract_external_id
    in: path
    required: true
    description: Contract external id.
    schema:
      type: string
      description: Contract external id.
      example: external_123
  - name: code
    in: path
    required: true
    description: Code.
    schema:
      type: string
      description: Code.
      example: example_code
get:
  tags:
    - contract_applied_rate_cards
  summary: Retrieve applied rate card
  description: >-
    Returns the record without nested relationships unless a supported expansion
    is requested.

    Requires the product catalog to be enabled and contract_rate_card read permission on the API key.
  operationId: findContractAppliedRateCard
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ContractAppliedRateCard.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
put:
  tags:
    - contract_applied_rate_cards
  summary: Update applied rate card
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged.

    Only pending contracts can be edited.

    Requires the product catalog to be enabled and contract_rate_card write permission on the API key.
  operationId: updateContractAppliedRateCard
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/ContractAppliedRateCardUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ContractAppliedRateCard.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
patch:
  tags:
    - contract_applied_rate_cards
  summary: Update applied rate card
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged.

    Only pending contracts can be edited.

    Requires the product catalog to be enabled and contract_rate_card write permission on the API key.
  operationId: patchContractAppliedRateCard
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/ContractAppliedRateCardUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ContractAppliedRateCard.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
delete:
  tags:
    - contract_applied_rate_cards
  summary: Delete applied rate card
  description: >-
    Removes the rate card from a pending contract.

    Requires the product catalog to be enabled and contract_rate_card write permission on the API key.
  operationId: destroyContractAppliedRateCard
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ContractAppliedRateCard.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
