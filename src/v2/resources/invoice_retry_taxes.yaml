parameters:
  - name: lago_id
    in: path
    required: true
    description: Unique identifier created by Lago.
    schema:
      type: string
      description: Unique identifier created by Lago.
      example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      format: uuid
post:
  tags:
    - invoices
  summary: Retry invoice taxes
  description: >-
    Retries failed tax processing for an eligible invoice.

    Requires the product catalog to be enabled and invoice write permission on the API key.
  operationId: retryTaxesInvoice
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Invoice.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
