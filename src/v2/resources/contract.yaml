delete:
  tags:
    - contracts
  summary: Delete contract
  description: >-
    DELETE ends the contract lifecycle; it does not delete the record. Active
    contracts are terminated and pending contracts are canceled.

    Requires the product catalog to be enabled and contract write permission on the API key.
  operationId: destroyContract
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Contract.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
