get:
  tags:
    - payments
  summary: List payments
  description: >-
    Returns a cursor-paginated list ordered by creation time, newest first. Use
    after or before to navigate. The page and per_page parameters are rejected.

    Lists organization payments, including manual and provider payments and payments attached to a payment request.

    Requires the product catalog to be enabled and payment read permission on the API key.
  operationId: findAllPayments
  parameters:
    - $ref: ../parameters/limit.yaml
    - $ref: ../parameters/after.yaml
    - $ref: ../parameters/before.yaml
    - $ref: ../parameters/include_total_count.yaml
    - $ref: ../parameters/created_at_from.yaml
    - $ref: ../parameters/created_at_to.yaml
    - name: invoice_id
      in: query
      required: false
      description: Includes payments made through a payment request that covers this
        invoice.
      schema:
        type: string
        description: Invoice identifier.
        example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        format: uuid
    - name: external_customer_id
      in: query
      required: false
      description: External customer id.
      schema:
        type: string
        description: External customer identifier.
        example: customer_123
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/PaymentsPaginated.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
post:
  tags:
    - payments
  summary: Create payment
  description: >-
    Records a manual payment against an existing invoice. A reference and
    positive integer amount are required. Premium access and invoice eligibility
    are checked, except for supported advance-fee payments.

    Requires the product catalog to be enabled and payment write permission on the API key.
  operationId: createPayment
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/PaymentCreateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Payment.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
