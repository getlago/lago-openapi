parameters:
  - name: code
    in: path
    required: true
    description: Code.
    schema:
      type: string
      description: Code.
      example: example_code
get:
  tags:
    - catalog_plans
  summary: Retrieve plan
  description: >-
    Returns the record without nested relationships unless a supported expansion
    is requested.

    Requires the product catalog to be enabled and plan read permission on the API key.
  operationId: findCatalogPlan
  parameters:
    - name: expands[]
      in: query
      required: false
      description: Relationships to include in this response. Only one expansion level
        is supported.
      schema:
        type: array
        description: Relationships to include.
        items:
          type: string
          enum:
            - taxes
          example: taxes
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/CatalogPlan.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
put:
  tags:
    - catalog_plans
  summary: Update plan
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged.

    Tax codes can be changed after a plan is in use. Other fields are subject to plan locking rules.

    Requires the product catalog to be enabled and plan write permission on the API key.
  operationId: updateCatalogPlan
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/CatalogPlanUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/CatalogPlan.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
patch:
  tags:
    - catalog_plans
  summary: Update plan
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged.

    Tax codes can be changed after a plan is in use. Other fields are subject to plan locking rules.

    Requires the product catalog to be enabled and plan write permission on the API key.
  operationId: patchCatalogPlan
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/CatalogPlanUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/CatalogPlan.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
