delete:
  tags:
    - billable_metrics
  summary: Delete billable metric
  description: >-
    Soft-deletes the metric. A metric referenced by a product filter cannot be
    deleted.

    Requires the product catalog to be enabled and billable_metric write permission on the API key.
  operationId: destroyBillableMetric
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/BillableMetric.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
