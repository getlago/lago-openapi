parameters:
  - $ref: '../parameters/lago_payment_receipt_id.yaml'
get:
  tags:
    - payment_receipts
  summary: Retrieve a payment receipt
  description: |-
    Retrieves a receipt of the organization, whether its payment pays an invoice or a payment request.
    Requires the product catalog to be enabled and the API key to have `payment_receipt` read permission.
    A receipt from another organization or an unknown receipt returns 404.
    The payment is returned as `lago_payment_id`; `expands[]=payment` also embeds it as `payment`. Any other expansion returns a 400 response.
  operationId: findPaymentReceipt
  parameters:
    - name: expands[]
      in: query
      required: false
      description: Related records to embed in the receipt. `payment` embeds the payment of the receipt.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - payment
          example: payment
  responses:
    '200':
      description: Payment receipt
      headers:
        X-Lago-Endpoint-Status:
          $ref: '../headers/EndpointStatus.yaml'
      content:
        application/json:
          schema:
            $ref: '../schemas/PaymentReceipt.yaml'
    '400':
      $ref: '../responses/InvalidExpansion.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
