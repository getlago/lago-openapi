post:
  tags:
    - events
  summary: Ingest a batch of events
  description: >-
    Accepts product-catalog events. external_subscription_id is not supported
    and returns 422. For ClickHouse organizations, the product event pipeline
    must be configured, and success acknowledges ingestion rather than completed
    enrichment. Newly accepted events may not appear in the list immediately.

    Requires the product catalog to be enabled and event write permission on the API key.
  operationId: createEventsBatch
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/EventBatchCreateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/EventsCollection.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
