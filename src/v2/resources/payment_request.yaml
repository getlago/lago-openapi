parameters:
  - name: lago_id
    in: path
    required: true
    description: Unique identifier created by Lago.
    schema:
      type: string
      description: Unique identifier created by Lago.
      example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      format: uuid
get:
  tags:
    - payment_requests
  summary: Retrieve payment request
  description: >-
    Returns the record without nested relationships unless a supported expansion
    is requested.

    Requires the product catalog to be enabled and payment_request read permission on the API key.
  operationId: findPaymentRequest
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/PaymentRequest.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
