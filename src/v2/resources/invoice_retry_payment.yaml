parameters:
  - name: lago_id
    in: path
    required: true
    description: Unique identifier created by Lago.
    schema:
      type: string
      description: Unique identifier created by Lago.
      example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      format: uuid
post:
  tags:
    - invoices
  summary: Retry invoice payment
  description: >-
    Retries collection using the selected or default payment method.

    Requires the product catalog to be enabled and invoice write permission on the API key.
  operationId: retryPaymentInvoice
  requestBody:
    required: false
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/RetryInvoicePaymentInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
