delete:
  tags:
    - webhook_endpoints
  summary: Delete webhook endpoint
  description: >-
    Permanently deletes the endpoint and its delivery records. Returns the
    deleted endpoint configuration without a deleted_at field. Expansions are
    not supported; a nonempty expands[] returns 400 expand_not_supported.

    Requires the product catalog to be enabled and webhook_endpoint write permission on the API key.
  operationId: destroyWebhookEndpoint
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/WebhookEndpoint.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
