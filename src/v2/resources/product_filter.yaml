parameters:
  - name: product_code
    in: path
    required: true
    description: Product code.
    schema:
      type: string
      description: Product code.
      example: example_code
  - name: code
    in: path
    required: true
    description: Code.
    schema:
      type: string
      description: Code.
      example: example_code
get:
  tags:
    - product_filters
  summary: Retrieve filter
  description: >-
    Returns the record without nested relationships unless a supported expansion
    is requested.

    Requires the product catalog to be enabled and product read permission on the API key.
  operationId: findProductFilter
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ProductFilter.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
put:
  tags:
    - product_filters
  summary: Update filter
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged. The
    code cannot change while the product is used by a plan or contract. Values
    cannot change while a contract has a rate card scoped to this filter.

    Supplying values replaces the existing value set. Omitting values preserves it.

    Requires the product catalog to be enabled and product write permission on the API key.
  operationId: updateProductFilter
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/ProductFilterUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ProductFilter.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
patch:
  tags:
    - product_filters
  summary: Update filter
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged. The
    code cannot change while the product is used by a plan or contract. Values
    cannot change while a contract has a rate card scoped to this filter.

    Supplying values replaces the existing value set. Omitting values preserves it.

    Requires the product catalog to be enabled and product write permission on the API key.
  operationId: patchProductFilter
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/ProductFilterUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ProductFilter.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
delete:
  tags:
    - product_filters
  summary: Delete filter
  description: >-
    Soft-deletes the filter, its values, its scoped rate cards and their rates.
    Deletion is rejected while the product is used by a plan or contract.

    Requires the product catalog to be enabled and product write permission on the API key.
  operationId: destroyProductFilter
  x-lago-cli-action: delete
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ProductFilter.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
