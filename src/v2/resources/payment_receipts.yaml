get:
  tags:
    - payment_receipts
  summary: List payment receipts
  description: >-
    Returns a cursor-paginated list ordered by creation time, newest first. Use
    after or before to navigate. The page and per_page parameters are rejected.

    Lists every receipt of the organization. Current receipt authorization uses invoice read permission.

    Requires the product catalog to be enabled and invoice read permission on the API key.
  operationId: findAllPaymentReceipts
  parameters:
    - $ref: ../parameters/limit.yaml
    - $ref: ../parameters/after.yaml
    - $ref: ../parameters/before.yaml
    - $ref: ../parameters/include_total_count.yaml
    - $ref: ../parameters/created_at_from.yaml
    - $ref: ../parameters/created_at_to.yaml
    - name: invoice_id
      in: query
      required: false
      description: Includes receipts for payments through a payment request covering
        the invoice. An unknown invoice returns an empty list.
      schema:
        type: string
        description: Invoice identifier.
        example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        format: uuid
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/PaymentReceiptsPaginated.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
