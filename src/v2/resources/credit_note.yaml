parameters:
  - name: lago_id
    in: path
    required: true
    description: Unique identifier created by Lago.
    schema:
      type: string
      description: Unique identifier created by Lago.
      example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      format: uuid
get:
  tags:
    - credit_notes
  summary: Retrieve credit note
  description: >-
    Retrieves a finalized credit note. Draft or unknown credit notes return 404.

    Requires the product catalog to be enabled and credit_note read permission on the API key.
  operationId: findCreditNote
  parameters:
    - name: expands[]
      in: query
      required: false
      description: Relationships to include in this response. Only one expansion level
        is supported.
      schema:
        type: array
        description: Relationships to include.
        items:
          type: string
          enum:
            - items
            - applied_taxes
            - customer
            - error_details
            - metadata
          example: items
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/CreditNote.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
put:
  tags:
    - credit_notes
  summary: Update credit note
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged.

    Only refund_status and metadata are accepted. Metadata updates merge keys. Draft credit notes return 404.

    Requires the product catalog to be enabled and credit_note write permission on the API key.
  operationId: updateCreditNote
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/CreditNoteUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/CreditNote.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
patch:
  tags:
    - credit_notes
  summary: Update credit note
  description: >-
    PUT and PATCH both accept partial updates. Omitted fields are unchanged.

    Only refund_status and metadata are accepted. Metadata updates merge keys. Draft credit notes return 404.

    Requires the product catalog to be enabled and credit_note write permission on the API key.
  operationId: patchCreditNote
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/CreditNoteUpdateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/CreditNote.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
