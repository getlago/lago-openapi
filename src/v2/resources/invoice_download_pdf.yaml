parameters:
  - name: lago_id
    in: path
    required: true
    description: Unique identifier created by Lago.
    schema:
      type: string
      description: Unique identifier created by Lago.
      example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      format: uuid
post:
  tags:
    - invoices
  summary: Download an invoice PDF
  description: >-
    For finalized invoices only. Returns the invoice if its PDF already exists;
    otherwise queues generation and returns an empty body.

    Requires the product catalog to be enabled and invoice write permission on the API key.
  operationId: downloadPdfInvoice
  responses:
    "200":
      description: Record returned if the document exists; otherwise an empty body
        while generation is queued
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Invoice.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
