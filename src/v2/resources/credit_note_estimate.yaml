post:
  tags:
    - credit_notes
  summary: Estimate a credit note
  description: >-
    Computes the amounts and taxes without creating a credit note. Items and
    applied taxes are always included; no expands[] parameter is needed.

    Requires the product catalog to be enabled and credit_note write permission on the API key.
  operationId: estimateCreditNote
  requestBody:
    required: true
    description: Request payload
    content:
      application/json:
        schema:
          $ref: ../schemas/CreditNoteEstimateInput.yaml
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/EstimatedCreditNote.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
