parameters:
  - name: customer_external_id
    in: path
    required: true
    description: Customer external identifier.
    schema:
      type: string
      description: Customer external identifier.
      example: external_123
  - name: lago_id
    in: path
    required: true
    description: Payment method identifier created by Lago.
    schema:
      type: string
      description: Payment method identifier created by Lago.
      example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      format: uuid
delete:
  tags:
    - customers
  summary: Delete a customer payment method
  description: >-
    Deletes the payment method and returns it with deleted_at set.

    Requires the product catalog to be enabled and payment_method write permission on the API key.
  operationId: destroyCustomerPaymentMethod
  x-lago-cli-action: delete-payment-method
  responses:
    "200":
      description: Successful response
      headers:
        X-Lago-Endpoint-Status:
          $ref: ../headers/EndpointStatus.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/PaymentMethod.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "401":
      $ref: ../responses/Unauthorized.yaml
    "403":
      $ref: ../responses/Forbidden.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "422":
      $ref: ../responses/UnprocessableEntity.yaml
