type: object
description: Webhook Endpoint.
required:
  - lago_id
  - name
  - webhook_url
  - signature_algo
  - event_types
  - created_at
  - updated_at
properties:
  lago_id:
    type: string
    description: Unique identifier created by Lago.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  name:
    type:
      - string
      - "null"
    description: Name.
    example: example
  webhook_url:
    type: string
    description: Public URL receiving webhook requests.
    example: https://hooks.acme.example/lago
    format: uri
  signature_algo:
    type: string
    description: Webhook signature algorithm. Endpoints created before `standard_webhooks` keep
      `jwt` or `hmac`.
    example: standard_webhooks
    enum:
      - jwt
      - hmac
      - standard_webhooks
  event_types:
    type:
      - array
      - "null"
    items:
      $ref: ./WebhookEventTypeEnum.yaml
    description: Event types delivered to this endpoint. Null means all events; an
      empty array selects none.
  created_at:
    type: string
    description: UTC creation timestamp, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  updated_at:
    type: string
    description: UTC timestamp of the last update, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  signing_keys:
    type: array
    description: Signing keys of the endpoint, oldest first, used to verify the webhook-signature
      header of `standard_webhooks` deliveries. Empty for a `jwt` or `hmac` endpoint. Included
      only with expands[]=signing_keys.
    items:
      $ref: ./WebhookEndpointSigningKeyObject.yaml
