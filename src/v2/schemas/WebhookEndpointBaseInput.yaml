type: object
minProperties: 1
properties:
  name:
    type:
      - string
      - "null"
    description: Endpoint name.
    example: Billing webhooks
  webhook_url:
    type: string
    description: Public URL receiving webhook requests. Private addresses are rejected.
    example: https://hooks.acme.example/lago
    format: uri
  signature_algo:
    type: string
    description: Webhook signature algorithm. Only `standard_webhooks` is accepted, and it is the
      default on create. Another value returns 422 with `value_is_invalid` on `signature_algo`
      and the accepted algorithms in `allowed_values`. An existing endpoint keeps its algorithm
      when the field is omitted or sent with its current value.
    example: standard_webhooks
    enum:
      - standard_webhooks
    default: standard_webhooks
  event_types:
    type:
      - array
      - "null"
    items:
      anyOf:
        - $ref: ./WebhookEventTypeEnum.yaml
        - type: string
          enum:
            - "*"
          example: "*"
    description: Event types to deliver. Null or ["*"] selects all events. Names are
      trimmed, lowercased and deduplicated. An empty array selects none.
