type: object
minProperties: 1
properties:
  rate_card_code:
    type: string
    description: Code of the rate card to attach.
    example: compute_usd
  units:
    type:
      - string
      - "null"
    description: Quantity for fixed pricing. Null uses the default quantity. Sent as
      a decimal string.
    example: "1.5"
    pattern: ^[0-9]+(\.[0-9]+)?$
  rate_phases:
    type:
      - array
      - "null"
    description: Ordered phase sequence. Omitted or null creates one default
      indefinite phase. An explicit empty list is rejected.
    items:
      $ref: ./RatePhaseBaseInput.yaml
      required:
        - code
    minItems: 1
