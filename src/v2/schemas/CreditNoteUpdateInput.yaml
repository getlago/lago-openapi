type: object
description: Update a credit note.
required:
  - credit_note
properties:
  credit_note:
    type: object
    minProperties: 1
    properties:
      refund_status:
        type:
          - string
          - "null"
        description: Refund status.
        example: pending
        enum:
          - pending
          - succeeded
          - failed
          - null
      metadata:
        type:
          - object
          - "null"
        description: Metadata as an object of key-value pairs. At most 50 keys are
          allowed. Keys are limited to 100 characters and values to 255
          characters. Values must be strings or null.
        additionalProperties:
          type:
            - string
            - "null"
          description: Metadata value. Null represents an empty value.
          example: example
          maxLength: 255
        maxProperties: 50
        propertyNames:
          maxLength: 100
