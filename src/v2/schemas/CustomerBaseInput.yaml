type: object
minProperties: 1
properties:
  external_id:
    type: string
    description: Unique customer identifier in your application.
    example: customer_123
  name:
    type:
      - string
      - "null"
    description: Name.
    example: example
  firstname:
    type:
      - string
      - "null"
    description: Firstname.
    example: example
  lastname:
    type:
      - string
      - "null"
    description: Lastname.
    example: example
  customer_type:
    type:
      - string
      - "null"
    description: Type of customer.
    example: company
    enum:
      - company
      - individual
      - null
  account_type:
    type: string
    description: Account type.
    example: customer
    enum:
      - customer
      - partner
  email:
    type:
      - string
      - "null"
    description: Email.
    example: billing@acme.example
  phone:
    type:
      - string
      - "null"
    description: Phone.
    example: example
  url:
    type:
      - string
      - "null"
    description: Url.
    example: example
  logo_url:
    type:
      - string
      - "null"
    description: Logo url.
    example: example
  address_line1:
    type:
      - string
      - "null"
    description: Address line1.
    example: example
  address_line2:
    type:
      - string
      - "null"
    description: Address line2.
    example: example
  city:
    type:
      - string
      - "null"
    description: City.
    example: example
  state:
    type:
      - string
      - "null"
    description: State.
    example: example
  zipcode:
    type:
      - string
      - "null"
    description: Zipcode.
    example: example
  country:
    type:
      - string
      - "null"
    description: Country.
    example: example
  legal_name:
    type:
      - string
      - "null"
    description: Legal name.
    example: example
  legal_number:
    type:
      - string
      - "null"
    description: Legal number.
    example: example
  tax_identification_number:
    type:
      - string
      - "null"
    description: Tax identification number.
    example: example
  currency:
    type:
      - string
      - "null"
    description: Currency as an ISO 4217 code.
    example: USD
  timezone:
    type:
      - string
      - "null"
    description: Timezone.
    example: example
  finalize_zero_amount_invoice:
    type:
      - string
      - "null"
    description: Whether to finalize zero-amount invoices. Null resets this setting
      to inherit.
    example: inherit
    enum:
      - inherit
      - skip
      - finalize
      - null
  skip_invoice_custom_sections:
    type: boolean
    description: Skip invoice custom sections.
    example: false
  external_salesforce_id:
    type:
      - string
      - "null"
    description: External salesforce id.
    example: example
  billing_entity_code:
    type: string
    description: Code of the customer billing entity.
    example: main
  invoice_grace_period:
    type:
      - integer
      - "null"
    description: Invoice grace period.
    example: 1
  payment_provider:
    type:
      - string
      - "null"
    description: Payment provider.
    example: example
  payment_provider_code:
    type:
      - string
      - "null"
    description: Payment provider code.
    example: example
  provider_customer_id:
    type:
      - string
      - "null"
    description: Customer identifier in the payment provider.
    example: cus_example
  provider_payment_methods:
    type:
      - array
      - "null"
    description: Payment methods allowed by the provider.
    items:
      type: string
      description: Payment method type.
      example: card
  document_locale:
    type:
      - string
      - "null"
    description: Document locale.
    example: example
  periodic_invoice_issuing_date_anchor:
    type:
      - string
      - "null"
    description: Date used to issue periodic invoices.
    example: current_period_end
    enum:
      - current_period_end
      - next_period_start
      - null
  periodic_invoice_issuing_date_adjustment:
    type:
      - string
      - "null"
    description: Adjustment applied to periodic invoice issuing dates.
    example: keep_anchor
    enum:
      - keep_anchor
      - align_with_finalization_date
      - null
  sync:
    type: boolean
    description: Whether to run payment-provider synchronization before returning
      the response rather than in a background job.
    example: false
  sync_with_provider:
    type: boolean
    description: Whether to create or synchronize the customer with the selected
      payment provider.
    example: false
  shipping_address:
    $ref: ./ShippingAddressInput.yaml
  tax_codes:
    type: array
    description: Tax codes to assign. An empty array removes the assignments.
    items:
      type: string
      description: Tax codes to assign. An empty array removes the assignments.
      example: vat
  invoice_custom_section_codes:
    type: array
    description: Invoice custom section codes to assign. An empty array removes the
      assignments.
    items:
      type: string
      description: Invoice custom section codes to assign. An empty array removes the
        assignments.
      example: legal
  metadata:
    type: array
    description: Customer metadata. At most five entries.
    items:
      type: object
      description: Metadata value.
      required:
        - key
        - value
      properties:
        id:
          type:
            - string
            - "null"
          description: Existing metadata identifier.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        key:
          type: string
          description: Metadata key.
          example: reference
          maxLength: 20
        value:
          type: string
          description: Metadata value.
          example: "123"
          maxLength: 100
        display_on_invoice:
          type: boolean
          description: Whether to display the value on invoices.
          example: false
    maxItems: 5
  integration_customers:
    type: array
    description: Integration mappings. Only one entry per integration type is accepted.
    items:
      type: object
      description: Customer integration mapping.
      required: []
      properties:
        id:
          type:
            - string
            - "null"
          description: Existing mapping identifier.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        code:
          type: string
          description: Mapping code.
          example: default
        external_customer_id:
          type: string
          description: Customer identifier in the integration.
          example: customer_123
        integration_type:
          type: string
          description: Integration type.
          example: netsuite
          enum:
            - netsuite
            - okta
            - anrok
            - avalara
            - xero
            - hubspot
            - salesforce
        integration_code:
          type: string
          description: Integration code.
          example: anrok
        subsidiary_id:
          type: string
          description: Provider subsidiary identifier.
          example: subsidiary_123
        sync_with_provider:
          type: boolean
          description: Whether to synchronize the mapping with the provider.
          example: false
        targeted_object:
          type: string
          description: Object targeted in the integration.
          example: customer
