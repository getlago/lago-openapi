type: object
description: Update a product.
required:
  - product
properties:
  product:
    type: object
    minProperties: 1
    properties:
      name:
        type: string
        description: Name shown in the catalog.
        example: Compute
      code:
        type: string
        description: Unique code within the organization.
        example: example_code
        pattern: ^(?!\.+$)[a-zA-Z0-9_\-.]+$
      description:
        type:
          - string
          - "null"
        description: Internal description.
        example: Compute charges.
      invoice_display_name:
        type:
          - string
          - "null"
        description: Name used on invoices. Defaults to the name when blank.
        example: Compute
      product_category_code:
        type:
          - string
          - "null"
        description: Category code. Null or an empty string removes the category.
        example: compute
