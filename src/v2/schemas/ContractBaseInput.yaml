type: object
minProperties: 1
properties:
  external_id:
    type: string
    description: Unique identifier for a live contract in your application.
    example: contract_123
  external_customer_id:
    type: string
    description: External customer identifier.
    example: customer_123
  name:
    type:
      - string
      - "null"
    description: Contract name.
    example: Annual agreement
  plan_code:
    type:
      - string
      - "null"
    description: Optional plan code. Plan-less contracts use directly attached rate cards.
    example: standard
  status:
    type:
      - string
      - "null"
    description: Set to draft to prepare the contract without billing it, whatever its
      start date, until it is published. Omitted or null, the start date decides
      between pending and active. Any other value answers 422 value_is_invalid.
      Requires Lago v1.58.0 or later; older servers ignore it and create a contract
      that bills.
    example: draft
    enum:
      - draft
      - null
  billing_time:
    type: string
    description: Whether billing aligns to the calendar or contract anniversary.
    example: calendar
    enum:
      - calendar
      - anniversary
    default: calendar
  billing_anchor_date:
    type:
      - string
      - "null"
    description: Optional billing anchor.
    example: null
    format: date
  started_at:
    type:
      - string
      - "null"
    description: Start timestamp. Defaults to now. A future start creates a pending
      contract. Required for a draft (422 value_is_mandatory otherwise).
    example: null
    format: date-time
  ended_at:
    type:
      - string
      - "null"
    description: Optional end timestamp. Must be after the start and not already in
      the past.
    example: null
    format: date-time
  consolidate_invoice:
    type: boolean
    description: Whether invoices can consolidate compatible contracts.
    example: true
  purchase_order_number:
    type:
      - string
      - "null"
    description: Purchase order reference.
    example: PO-123
  invoice_custom_section:
    type: object
    description: Invoice section selection.
    required: []
    properties:
      skip_invoice_custom_sections:
        type: boolean
        description: Whether to skip invoice custom sections.
        example: false
      invoice_custom_section_codes:
        type: array
        description: Invoice custom section codes.
        items:
          type: string
          description: Section code.
          example: legal_terms
