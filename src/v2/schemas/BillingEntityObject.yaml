type: object
description: Billing Entity.
required:
  - code
  - name
  - default_currency
  - country
  - address_line1
  - address_line2
  - phone
  - city
  - state
  - zipcode
  - einvoicing
  - email
  - legal_name
  - legal_number
  - timezone
  - email_settings
  - document_numbering
  - document_number_prefix
  - tax_identification_number
  - finalize_zero_amount_invoice
  - invoice_footer
  - invoice_grace_period
  - document_locale
  - eu_tax_management
  - periodic_invoice_issuing_date_anchor
  - periodic_invoice_issuing_date_adjustment
  - lago_id
  - is_default
  - logo_url
  - created_at
  - updated_at
  - archived_at
  - deleted_at
properties:
  code:
    type: string
    description: Code.
    example: example
  name:
    type: string
    description: Name.
    example: example
  default_currency:
    type: string
    description: Default currency.
    example: example
  country:
    type:
      - string
      - "null"
    description: Country.
    example: example
  address_line1:
    type:
      - string
      - "null"
    description: Address line1.
    example: example
  address_line2:
    type:
      - string
      - "null"
    description: Address line2.
    example: example
  phone:
    type:
      - string
      - "null"
    description: Phone.
    example: example
  city:
    type:
      - string
      - "null"
    description: City.
    example: example
  state:
    type:
      - string
      - "null"
    description: State.
    example: example
  zipcode:
    type:
      - string
      - "null"
    description: Zipcode.
    example: example
  einvoicing:
    type: boolean
    description: Einvoicing.
    example: false
  email:
    type:
      - string
      - "null"
    description: Email.
    example: billing@acme.example
  legal_name:
    type:
      - string
      - "null"
    description: Legal name.
    example: example
  legal_number:
    type:
      - string
      - "null"
    description: Legal number.
    example: example
  timezone:
    type: string
    description: Timezone.
    example: example
  email_settings:
    type: array
    description: Enabled email notification types.
    items:
      type: string
      description: Enabled email notification types.
      example: invoice.finalized
  document_numbering:
    type: string
    description: Document numbering scope.
    example: per_customer
    enum:
      - per_customer
      - per_billing_entity
  document_number_prefix:
    type:
      - string
      - "null"
    description: Document number prefix.
    example: example
  tax_identification_number:
    type:
      - string
      - "null"
    description: Tax identification number.
    example: example
  finalize_zero_amount_invoice:
    type: boolean
    description: Finalize zero amount invoice.
    example: false
  invoice_footer:
    type:
      - string
      - "null"
    description: Invoice footer.
    example: Example
  invoice_grace_period:
    type: integer
    description: Invoice grace period.
    example: 1
  document_locale:
    type: string
    description: Document locale.
    example: example
  eu_tax_management:
    type:
      - boolean
      - "null"
    description: Eu tax management.
    example: false
  periodic_invoice_issuing_date_anchor:
    type:
      - string
      - "null"
    description: Date used to issue periodic invoices.
    example: current_period_end
    enum:
      - current_period_end
      - next_period_start
      - null
  periodic_invoice_issuing_date_adjustment:
    type:
      - string
      - "null"
    description: Adjustment applied to periodic invoice issuing dates.
    example: keep_anchor
    enum:
      - keep_anchor
      - align_with_finalization_date
      - null
  lago_id:
    type: string
    description: Unique identifier created by Lago.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  is_default:
    type: boolean
    description: Whether this is the organization default billing entity.
    example: false
  logo_url:
    type:
      - string
      - "null"
    description: Logo URL.
    example: https://cdn.acme.example/logo.png
  created_at:
    type: string
    description: UTC creation timestamp, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  updated_at:
    type: string
    description: UTC timestamp of the last update, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  archived_at:
    type:
      - string
      - "null"
    description: Archived at.
    example: null
    format: date-time
  deleted_at:
    type:
      - string
      - "null"
    description: UTC deletion timestamp, with microsecond precision. Null until deletion.
    example: null
    format: date-time
  taxes:
    type: array
    description: Assigned taxes. Included only with expands[]=taxes.
    items:
      $ref: ./TaxObject.yaml
  selected_invoice_custom_sections:
    type: array
    description: Selected sections. Included only with
      expands[]=selected_invoice_custom_sections.
    items:
      $ref: ./InvoiceCustomSectionObject.yaml
