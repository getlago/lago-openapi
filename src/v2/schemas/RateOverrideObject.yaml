type: object
description: Rate Override.
required:
  - lago_id
  - rate_model
  - rate_properties
  - min_amount_cents
  - billing_interval_count
  - billing_interval_unit
  - pricing_unit_conversion_rate
  - deleted_at
properties:
  lago_id:
    type: string
    description: Unique identifier created by Lago.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  rate_model:
    type: string
    description: Pricing model. Fixed products support standard, graduated and
      volume. Volume cannot be billed in advance; dynamic requires a sum metric.
      Proration and aggregation can impose further restrictions.
    example: standard
    enum:
      - standard
      - graduated
      - package
      - percentage
      - volume
      - graduated_percentage
      - custom
      - dynamic
  rate_properties:
    $ref: ./RatePropertiesObject.yaml
  min_amount_cents:
    type: integer
    description: Minimum amount, in cents.
    example: 100
  billing_interval_count:
    type:
      - integer
      - "null"
    description: Billing interval count.
    example: 1
  billing_interval_unit:
    type:
      - string
      - "null"
    description: Unit of the billing interval.
    example: day
    enum:
      - day
      - week
      - month
      - year
      - null
  pricing_unit_conversion_rate:
    type:
      - string
      - "null"
    description: Pricing unit conversion rate. Sent as a decimal string.
    example: "1.5"
    pattern: ^-?[0-9]+(\.[0-9]+)?$
  deleted_at:
    type:
      - string
      - "null"
    description: UTC deletion timestamp, with microsecond precision. Null until deletion.
    example: null
    format: date-time
