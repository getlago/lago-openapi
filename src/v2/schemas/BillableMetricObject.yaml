type: object
description: Billable Metric.
required:
  - lago_id
  - name
  - code
  - description
  - aggregation_type
  - weighted_interval
  - recurring
  - rounding_function
  - rounding_precision
  - field_name
  - expression
  - created_at
  - updated_at
  - deleted_at
properties:
  lago_id:
    type: string
    description: Unique identifier created by Lago.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  name:
    type: string
    description: Name.
    example: example
  code:
    type: string
    description: Code.
    example: example
  description:
    type:
      - string
      - "null"
    description: Description.
    example: example
  aggregation_type:
    type: string
    description: How event values are aggregated.
    example: count_agg
    enum:
      - count_agg
      - sum_agg
      - max_agg
      - unique_count_agg
      - weighted_sum_agg
      - latest_agg
  weighted_interval:
    type:
      - string
      - "null"
    description: Weighting interval for weighted_sum_agg.
    example: seconds
    enum:
      - seconds
      - null
  recurring:
    type: boolean
    description: Recurring.
    example: false
  rounding_function:
    type:
      - string
      - "null"
    description: Rounding applied to the aggregated quantity.
    example: round
    enum:
      - round
      - ceil
      - floor
      - null
  rounding_precision:
    type:
      - integer
      - "null"
    description: Rounding precision.
    example: 1
  field_name:
    type:
      - string
      - "null"
    description: Field name.
    example: example
  expression:
    type:
      - string
      - "null"
    description: Expression.
    example: example
  created_at:
    type: string
    description: UTC creation timestamp, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  updated_at:
    type: string
    description: UTC timestamp of the last update, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  deleted_at:
    type:
      - string
      - "null"
    description: UTC deletion timestamp, with microsecond precision. Null until deletion.
    example: null
    format: date-time
