type: object
minProperties: 1
properties:
  name:
    type: string
    description: Name shown in the catalog.
    example: Compute
  code:
    type: string
    description: Unique code within the organization.
    example: example_code
    pattern: ^(?!\.+$)[a-zA-Z0-9_\-.]+$
  description:
    type:
      - string
      - "null"
    description: Internal description.
    example: Compute charges.
  invoice_display_name:
    type:
      - string
      - "null"
    description: Name used on invoices. Defaults to the name when blank.
    example: Compute
  values:
    type: array
    description: Matches against keys of the product billable metric. Cannot be empty.
    items:
      $ref: ./ProductFilterValueInput.yaml
    minItems: 1
