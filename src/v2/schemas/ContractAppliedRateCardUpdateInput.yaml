type: object
description: Update an applied rate card.
required:
  - applied_rate_card
properties:
  applied_rate_card:
    type: object
    minProperties: 1
    properties:
      units:
        type:
          - string
          - "null"
        description: Quantity for fixed pricing. Null uses the default quantity. Sent as
          a decimal string.
        example: "1.5"
        pattern: ^[0-9]+(\.[0-9]+)?$
      billing_anchor_date:
        type: string
        description: Billing anchor for this applied card. Null is rejected. Omit the
          field to keep the current anchor.
        example: 2022-04-29
        format: date
