type: object
description: Error attached to an invoice.
required:
  - lago_id
  - error_code
  - details
  - created_at
  - updated_at
  - deleted_at
properties:
  lago_id:
    type: string
    description: Unique identifier created by Lago.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  error_code:
    type: string
    description: Error category.
    example: not_provided
    enum:
      - not_provided
      - tax_error
      - tax_voiding_error
      - invoice_generation_error
  details:
    type: object
    description: Details.
    additionalProperties: true
  created_at:
    type: string
    description: UTC creation timestamp, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  updated_at:
    type: string
    description: UTC timestamp of the last update, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  deleted_at:
    type:
      - string
      - "null"
    description: UTC deletion timestamp, with microsecond precision. Null until deletion.
    example: null
    format: date-time
