type: object
description: Invoice.
required:
  - lago_id
  - number
  - invoice_type
  - status
  - payment_status
  - billing_entity_code
  - lago_customer_id
  - external_customer_id
  - currency
  - issuing_date
  - payment_due_date
  - payment_overdue
  - purchase_order_number
  - fees_amount_cents
  - sub_total_excluding_taxes_amount_cents
  - taxes_amount_cents
  - sub_total_including_taxes_amount_cents
  - credit_notes_amount_cents
  - total_amount_cents
  - total_offsetted_credit_note_amount_cents
  - total_paid_amount_cents
  - total_due_amount_cents
  - pdf_url
  - xml_url
  - payment_dispute_lost_at
  - voided_at
  - created_at
  - updated_at
properties:
  lago_id:
    type: string
    description: Unique identifier created by Lago.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  number:
    type: string
    description: Number.
    example: example
  invoice_type:
    type: string
    description: Type of invoice. Advance fees are named advance_fees rather than
      the v1 advance_charges value.
    example: contract
    enum:
      - contract
      - advance_fees
      - subscription
      - add_on
      - credit
      - one_off
      - progressive_billing
  status:
    type: string
    description: Invoice lifecycle status.
    example: generating
    enum:
      - generating
      - draft
      - open
      - finalized
      - voided
      - failed
      - closed
      - pending
      - deleted
  payment_status:
    type: string
    description: Payment status.
    example: pending
    enum:
      - pending
      - succeeded
      - failed
  billing_entity_code:
    type: string
    description: Code of the invoice billing entity.
    example: main
  lago_customer_id:
    type:
      - string
      - "null"
    description: Customer identifier.
    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    format: uuid
  external_customer_id:
    type: string
    description: External customer identifier.
    example: customer_123
  currency:
    type:
      - string
      - "null"
    description: Currency as an ISO 4217 code.
    example: USD
  issuing_date:
    type:
      - string
      - "null"
    description: Issuing date.
    example: null
    format: date
  payment_due_date:
    type:
      - string
      - "null"
    description: Payment due date.
    example: null
    format: date
  payment_overdue:
    type:
      - boolean
      - "null"
    description: Payment overdue.
    example: false
  purchase_order_number:
    type:
      - string
      - "null"
    description: Purchase order number.
    example: example
  fees_amount_cents:
    type: integer
    description: Fees amount cents.
    example: 100
  sub_total_excluding_taxes_amount_cents:
    type: integer
    description: Sub total excluding taxes amount cents.
    example: 100
  taxes_amount_cents:
    type: integer
    description: Taxes amount cents.
    example: 100
  sub_total_including_taxes_amount_cents:
    type: integer
    description: Sub total including taxes amount cents.
    example: 100
  credit_notes_amount_cents:
    type: integer
    description: Credit notes amount cents.
    example: 100
  total_amount_cents:
    type: integer
    description: Total amount cents.
    example: 100
  total_offsetted_credit_note_amount_cents:
    type: integer
    description: Total applied credit note offsets, in cents.
    example: 0
  total_paid_amount_cents:
    type: integer
    description: Total paid amount cents.
    example: 100
  total_due_amount_cents:
    type: integer
    description: Amount still due, in cents.
    example: 1000
  pdf_url:
    type:
      - string
      - "null"
    description: Document download URL, or null while the document is unavailable.
    example: https://documents.example/invoice.pdf
    format: uri
  xml_url:
    type:
      - string
      - "null"
    description: Document download URL, or null while the document is unavailable.
    example: https://documents.example/invoice.pdf
    format: uri
  payment_dispute_lost_at:
    type:
      - string
      - "null"
    description: Payment dispute lost at.
    example: null
    format: date-time
  voided_at:
    type:
      - string
      - "null"
    description: Voided at.
    example: null
    format: date-time
  created_at:
    type: string
    description: UTC creation timestamp, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  updated_at:
    type: string
    description: UTC timestamp of the last update, with microsecond precision.
    example: 2022-04-29T08:59:51.123456Z
    format: date-time
  fees:
    type: array
    description: Present only with expands[]=fees. At most 1000 fees may be
      expanded; use GET /fees for larger invoices.
    items:
      $ref: ./FeeObject.yaml
  applied_taxes:
    type: array
    description: Present only with expands[]=applied_taxes.
    items:
      $ref: ./InvoiceAppliedTaxObject.yaml
  customer:
    $ref: ./CustomerObject.yaml
    description: Present only with expands[]=customer.
  contracts:
    type: array
    description: Present only with expands[]=contracts. Contracts are derived from
      fee provenance.
    items:
      $ref: ./ContractObject.yaml
  applied_invoice_custom_sections:
    type: array
    description: Present only with expands[]=applied_invoice_custom_sections.
    items:
      $ref: ./AppliedInvoiceCustomSectionObject.yaml
  error_details:
    type: array
    description: Present only with expands[]=error_details.
    items:
      $ref: ./ErrorDetailObject.yaml
