type: object
properties:
  metadata:
    type: object
    description: Metadata keys and values. Omitted metadata defaults to an empty
      object. At most 50 keys are allowed. Keys are limited to 100 characters
      and values to 255 characters. Values must be strings or null.
    additionalProperties:
      type:
        - string
        - "null"
      description: Metadata value. Null represents an empty value.
      example: example
      maxLength: 255
    example:
      reference: example
    maxProperties: 50
    propertyNames:
      maxLength: 100
