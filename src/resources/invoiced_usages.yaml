get:
  tags:
    - analytics
  summary: List usage revenue
  description: Reports the monthly revenue generated by usage-based fees, broken down by billable metric. It only counts usage that has already been invoiced, so the usage of the current billing period is not included. Amounts exclude taxes and are net of coupons. Fees on self-billed invoices and on invoices with a lost payment dispute are left out.
  operationId: findAllInvoicedUsages
  parameters:
    - name: currency
      in: query
      description: The currency of invoiced usage analytics. Format must be ISO 4217.
      required: false
      explode: true
      schema:
        allOf:
          - $ref: '../schemas/Currency.yaml'
          - example: 'USD'
    - $ref: '../parameters/billing_entity_code.yaml'
    - $ref: '../parameters/months.yaml'
  responses:
    '200':
      description: Invoiced usage
      content:
        application/json:
          schema:
            $ref: '../schemas/InvoicedUsages.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
