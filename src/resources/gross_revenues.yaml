get:
  tags:
    - analytics
  summary: List gross revenue
  description: Gross revenue is the monthly sum of the totals of `finalized` invoices and of the amounts of the fees paid in advance that are not attached to an invoice. Invoice totals include taxes, are net of coupons, and are reduced by the amounts refunded through credit notes. Self-billed invoices and invoices with a lost payment dispute are excluded.
  operationId: findAllGrossRevenues
  parameters:
    - name: currency
      in: query
      description: Currency of revenue analytics. Format must be ISO 4217.
      required: false
      explode: true
      schema:
        allOf:
          - $ref: "../schemas/Currency.yaml"
          - example: "USD"
    - name: external_customer_id
      in: query
      description: The customer external unique identifier (provided by your own application). Use it to filter revenue analytics at the customer level.
      required: false
      explode: true
      schema:
        type: string
        example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
    - $ref: "../parameters/billing_entity_code.yaml"
    - $ref: "../parameters/months.yaml"
  responses:
    "200":
      description: Gross revenue
      content:
        application/json:
          schema:
            $ref: "../schemas/GrossRevenues.yaml"
    "401":
      $ref: "../responses/Unauthorized.yaml"
    "403":
      $ref: "../responses/Forbidden.yaml"
