post:
  tags:
    - payments
  summary: Create a payment
  description: This endpoint is used to create a manual payment
  operationId: createPayment
  requestBody:
    description: Payment payload
    content:
      application/json:
        schema:
          $ref: '../schemas/PaymentCreateInput.yaml'
    required: true
  responses:
    '200':
      description: Payment created
      content:
        application/json:
          schema:
            $ref: '../schemas/Payment.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '422':
      $ref: '../responses/UnprocessableEntity.yaml'
get:
  tags:
    - payments
  summary: List all payments
  description: >-
    List payments with filters combined using AND and values within each array combined using OR.
    Results keep their existing visibility rules and are ordered by creation date descending, then ID.
    Amounts are integer cents and support the full signed 64-bit range from 0 through 9223372036854775807.
    Unknown enum or currency values, negative or out-of-range amounts, inverted amount bounds,
    invalid invoice UUIDs and receipt or invoice numbers longer than 255 characters return 422 validation_errors.
    Invalid date bounds are ignored. Search narrows the scope before exact filters apply; invoice search is
    skipped when invoice_id or invoice_number is supplied, and customer search is skipped when external_customer_id is supplied.
    Repeat the same filters when requesting the page number returned in meta.next_page.
  operationId: findAllPayments
  parameters:
    - $ref: "../parameters/page.yaml"
    - $ref: "../parameters/per_page.yaml"
    - $ref: "../parameters/external_customer_id.yaml"
    - $ref: "../parameters/payment_invoice_id.yaml"
    - $ref: "../parameters/payment_payable_status.yaml"
    - $ref: "../parameters/payment_payable_statuses.yaml"
    - $ref: "../parameters/amount_from.yaml"
    - $ref: "../parameters/amount_to.yaml"
    - $ref: "../parameters/receipt_number.yaml"
    - $ref: "../parameters/payment_created_at_from.yaml"
    - $ref: "../parameters/payment_created_at_to.yaml"
    - $ref: "../parameters/payment_provider_type.yaml"
    - $ref: "../parameters/payment_method_type.yaml"
    - $ref: "../parameters/currency.yaml"
    - $ref: "../parameters/invoice_number.yaml"
    - $ref: "../parameters/payment_type.yaml"
    - $ref: "../parameters/payable_type.yaml"
    - $ref: "../parameters/search_term.yaml"
  responses:
    '200':
      description: Payments
      content:
        application/json:
          schema:
            $ref: '../schemas/PaymentsPaginated.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    "422":
      $ref: "../responses/UnprocessableEntity.yaml"
