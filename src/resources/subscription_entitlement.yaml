parameters:
  - name: external_id
    in: path
    description: External ID of the existing subscription
    required: true
    schema:
      type: string
      example: '5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba'
  - name: feature_code
    in: path
    description: Code of the existing feature
    required: true
    schema:
      type: string
      example: 'seats'
delete:
  tags:
    - entitlements
  summary: Remove an entitlement from a subscription
  description: This endpoint removes a specific feature entitlement from a subscription. The plan keeps the feature and other subscriptions are not affected, but this subscription stops getting it. It returns the full list of entitlements remaining on the subscription.
  operationId: destroySubscriptionEntitlement
  parameters:
    - $ref: "../parameters/subscription_status.yaml"
  responses:
    '200':
      description: Remaining subscription entitlements
      content:
        application/json:
          schema:
            $ref: '../schemas/Entitlement/SubscriptionEntitlements.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
