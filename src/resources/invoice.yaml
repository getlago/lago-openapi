parameters:
  - $ref: '../parameters/lago_invoice_id.yaml'
put:
  tags:
    - invoices
  summary: Update an invoice
  description: This endpoint is used for updating an existing invoice.
  operationId: updateInvoice
  requestBody:
    description: Update an existing invoice
    content:
      application/json:
        schema:
          $ref: '../schemas/InvoiceUpdateInput.yaml'
    required: true
  responses:
    '200':
      description: Invoice updated
      content:
        application/json:
          schema:
            $ref: '../schemas/Invoice.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '422':
      $ref: '../responses/UnprocessableEntity.yaml'
get:
  tags:
    - invoices
  summary: Retrieve an invoice
  description: This endpoint is used for retrieving a specific invoice that has been issued.
  operationId: findInvoice
  responses:
    '200':
      description: Invoice
      content:
        application/json:
          schema:
            $ref: '../schemas/Invoice.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
delete:
  tags:
    - invoices
  summary: Delete a draft invoice
  description: |-
    This endpoint is used for permanently deleting a `draft` invoice. Deleting a draft invoice removes it entirely: it never becomes accounts receivable, consumes no invoice number, and disappears from every list, export, and analytics surface. Only invoices in the `draft` status can be deleted; for a `finalized` invoice, void it instead.
  operationId: deleteInvoice
  responses:
    '200':
      description: Invoice deleted
      content:
        application/json:
          schema:
            $ref: '../schemas/Invoice.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '405':
      $ref: '../responses/NotAllowed.yaml'
