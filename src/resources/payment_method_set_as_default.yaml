parameters:
  - name: lago_id
    in: path
    description: The payment method unique identifier, created by Lago.
    required: true
    schema:
      type: string
      format: uuid
      example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
  - $ref: "../parameters/external_customer_id_path.yaml"
put:
  tags:
    - payment_methods
  operationId: paymentMethodSetAsDefault
  summary: Set the payment method as default
  description: This endpoint sets a payment method as the customer's default one. It is the payment method Lago uses when a payment is triggered without an explicit one. Any other default payment method of the customer is unset.
  responses:
    '200':
      description: Payment method set as default
      content:
        application/json:
          schema:
            $ref: '../schemas/PaymentMethod.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
