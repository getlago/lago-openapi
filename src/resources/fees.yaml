get:
  tags:
    - fees
  summary: List all fees
  description: This endpoint is used for retrieving all fees that have been issued.
  operationId: findAllFees
  parameters:
    - $ref: "../parameters/page.yaml"
    - $ref: "../parameters/per_page.yaml"
    - $ref: "../parameters/external_customer_id.yaml"
    - $ref: "../parameters/external_subscription_id.yaml"
    - name: event_transaction_id
      in: query
      description: Filter results by event transaction ID
      required: false
      explode: true
      schema:
        type: string
        example: "et_12345678"
    - name: currency
      in: query
      description: Filter results by the fee's currency.
      required: false
      explode: true
      schema:
        allOf:
          - $ref: "../schemas/Currency.yaml"
          - example: "USD"
    - name: fee_type
      in: query
      description: The fee type. Possible values are `add_on`, `charge`, `fixed_charge`, `credit`, `subscription` or `commitment`.
      required: false
      explode: true
      schema:
        type: string
        enum:
          - charge
          - fixed_charge
          - add_on
          - subscription
          - credit
          - commitment
        example: "charge"
    - name: billable_metric_code
      in: query
      description: Filter results by the `code` of the billable metric attached to the fee. Only applies to `charge` types.
      required: false
      explode: true
      schema:
        type: string
        example: "bm_code"
    - name: payment_status
      in: query
      description: Indicates the payment status of the fee. It represents the current status of the payment associated with the fee. The possible values for this field are `pending`, `succeeded`, `failed` and `refunded`.
      required: false
      explode: true
      schema:
        type: string
        enum:
          - pending
          - succeeded
          - failed
          - refunded
        example: "succeeded"
    - name: created_at_from
      in: query
      description: Filter results created at or after this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: created_at_to
      in: query
      description: Filter results created at or before this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: succeeded_at_from
      in: query
      description: Filter results with a payment success at or after this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: succeeded_at_to
      in: query
      description: Filter results with a payment success at or before this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: failed_at_from
      in: query
      description: Filter results with a payment failure at or after this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: failed_at_to
      in: query
      description: Filter results with a payment failure at or before this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: refunded_at_from
      in: query
      description: Filter results with a payment refund at or after this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
    - name: refunded_at_to
      in: query
      description: Filter results with a payment refund at or before this date and time in UTC.
      required: false
      explode: true
      schema:
        type: string
        example: "2023-03-28T12:21:51Z"
        format: date-time
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: "../schemas/FeesPaginated.yaml"
    "401":
      $ref: "../responses/Unauthorized.yaml"
    "422":
      $ref: "../responses/UnprocessableEntity.yaml"
