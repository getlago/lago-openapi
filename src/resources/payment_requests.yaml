post:
  tags:
    - payment_requests
  summary: Create a payment request
  description: This endpoint is used to create a payment request to collect the payment of the overdue invoices of a customer.
  operationId: createPaymentRequest
  requestBody:
    description: Payment request payload
    content:
      application/json:
        schema:
          $ref: '../schemas/PaymentRequestCreateInput.yaml'
    required: true
  responses:
    '200':
      description: Payment request created
      content:
        application/json:
          schema:
            $ref: '../schemas/PaymentRequest.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '405':
      $ref: '../responses/NotAllowed.yaml'
    '422':
      $ref: '../responses/UnprocessableEntity.yaml'
get:
  tags:
    - payment_requests
  summary: List all payment requests
  description: This endpoint is used to list all existing payment requests.
  operationId: findAllPaymentRequests
  parameters:
    - $ref: '../parameters/page.yaml'
    - $ref: '../parameters/per_page.yaml'
    - $ref: '../parameters/currency.yaml'
    - $ref: '../parameters/external_customer_id.yaml'
    - $ref: '../parameters/payment_status.yaml'
    - name: billing_entity_codes[]
      in: query
      description: Filter payment requests by billing entity codes.
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
        example: [billing_entity_code_1, billing_entity_code_2]
  responses:
    '200':
      description: Payment requests
      content:
        application/json:
          schema:
            $ref: '../schemas/PaymentRequestsPaginated.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
