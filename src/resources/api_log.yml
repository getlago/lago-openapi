parameters:
  - name: request_id
    in: path
    description: The unique identifier of the API log, which is the identifier of the request.
    required: true
    schema:
      type: string
      example: 'bdc0eda6-ea52-4f72-a46a-94f47a89b546'
get:
  tags:
    - api_logs
  summary: Retrieve an API log
  description: This endpoint retrieves an existing API log, which represents a request made to Lago's API. The API log is identified by its request id.
  operationId: findApiLog
  responses:
    '200':
      description: API log
      content:
        application/json:
          schema:
            $ref: '../schemas/ApiLog.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
