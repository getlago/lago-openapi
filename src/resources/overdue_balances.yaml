get:
  tags:
    - analytics
  summary: List overdue balance
  description: Overdue balance is the amount still due on invoices that are past their payment due date. Each entry covers one month of payment due dates and sums the invoice totals minus the amounts already paid and minus the credits applied by finalized credit notes. Self-billed invoices are excluded.
  operationId: findAllOverdueBalances
  parameters:
    - name: currency
      in: query
      description: Filter the overdue balances by the currency of the invoices. Format must be ISO 4217.
      required: false
      explode: true
      schema:
        allOf:
          - $ref: "../schemas/Currency.yaml"
          - example: "USD"
    - name: external_customer_id
      in: query
      description: The customer external unique identifier (provided by your own application). Use it to restrict the overdue balances to a single customer.
      required: false
      explode: true
      schema:
        type: string
        example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
    - $ref: "../parameters/billing_entity_code.yaml"
    - $ref: "../parameters/months.yaml"
  responses:
    "200":
      description: Overdue balance
      content:
        application/json:
          schema:
            $ref: "../schemas/OverdueBalances.yaml"
    "401":
      $ref: "../responses/Unauthorized.yaml"
    "403":
      $ref: "../responses/Forbidden.yaml"
