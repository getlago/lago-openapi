type: object
required:
  - activity_id
  - activity_source
  - activity_type
  - activity_object
  - activity_object_changes
  - user_email
  - external_customer_id
  - external_subscription_id
  - logged_at
  - resource_id
  - resource_type
  - created_at
properties:
  activity_id:
    type: string
    format: "uuid"
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
    description: Unique identifier assigned to the activity log within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the activity log record within the Lago system.
  user_email:
    type:
      - string
      - "null"
    format: "email"
    example: "dinesh@piedpiper.example"
    description: The email of the user who performed the activity. It is null when the action was performed with an API key or by the system.
  activity_type:
    type: string
    example: "billable_metric.created"
    description: The action that was performed on the resource.
  activity_source:
    type: string
    example: "api"
    enum:
      - api
      - front
      - system
    description: The source that triggered the action.
  activity_object:
    type: 
      - object
      - "null"
    example: { "lago_id": "dad68bc7-c01a-4ad8-a87b-13e78693a5bc", "plan_id": "b9155544-e261-4e92-b54e-f65d7609294c" }
    description: The state of the resource after the action, keyed by top-level attribute name. Nested values are returned JSON-encoded.
  activity_object_changes:
    type:
      - object
      - "null"
    example: { "plan_id": "[null,\"b9155544-e261-4e92-b54e-f65d7609294c\"]" }
    description: The attributes the action changed, keyed by attribute name. Each value is the JSON-encoded pair of the previous and the new value. It is empty when the activity type is not an update.
  external_customer_id:
    type:
      - string
      - "null"
    description: The customer external unique identifier (provided by your own application).
    example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
  external_subscription_id:
    type: 
      - string
      - "null"
    description: Unique identifier assigned to the subscription in your application.
    example: "external_id"
  resource_id:
    type: string
    description: The unique identifier of the resource the action was applied to.
    format: uuid
    example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
  resource_type:
    type: string
    description: The type of the resource the action was applied to.
    example: "BillableMetric"
  logged_at:
    type: string
    format: "date-time"
    example: "2025-03-31T12:31:44Z"
    description: The date when the action happened, presented in the ISO 8601 datetime format, specifically in Coordinated Universal Time (UTC).
  created_at:
    type: string
    format: "date-time"
    example: "2022-04-29T08:59:51Z"
    description: The creation date of the activity log record in the Lago application, presented in the ISO 8601 datetime format, specifically in Coordinated Universal Time (UTC).
