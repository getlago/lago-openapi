type: object
required:
  - lago_customer_id
  - external_customer_id
  - payment_provider
  - payment_provider_code
  - provider_error
properties:
  lago_customer_id:
    type: string
    format: "uuid"
    description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
  external_customer_id:
    type: string
    description: The customer external unique identifier (provided by your own application).
    example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
  payment_provider:
    type: string
    enum:
      - adyen
      - cashfree
      - flutterwave
      - gocardless
      - moneyhash
      - stripe
    description: The type of payment provider the customer is attached to.
    example: "stripe"
  payment_provider_code:
    type:
      - string
      - "null"
    description: Code of the payment provider connection. It is `null` when no payment provider connection is recorded on the customer, for example when the connection could not be created.
    example: "stripe-eu-1"
  provider_error:
    description: The error returned by the payment provider. It carries a `message` and an `error_code` key.
    oneOf:
      - type: string
      - type: object
        additionalProperties: true
