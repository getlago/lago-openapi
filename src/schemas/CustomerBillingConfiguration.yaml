type: object
description: The billing configuration fields shared by the customer create payload and the customer object. They hold the settings used to invoice the customer and to process their payments.
properties:
  invoice_grace_period:
    type:
      - integer
      - "null"
    example: 3
    description: The grace period, expressed in days, for the invoice. This period refers to the additional time granted to the customer beyond the invoice due date to adjust usage and line items. It is null when the customer has no grace period of its own and falls back to the billing entity. This is a premium feature, the value is ignored without a premium license.
  subscription_invoice_issuing_date_anchor:
    type: [string, "null"]
    example: next_period_start
    description: |-
      Defines whether the issuing date follows the current billing period's end date or the next period starting date.
    enum:
      - current_period_end
      - next_period_start
      - null
    default: null
  subscription_invoice_issuing_date_adjustment:
    type: [string, "null"]
    example: keep_anchor
    description: |-
      The logic applied on top of the subscription_invoice_issuing_date_anchor rule. You can opt to use the invoice finalization date, that includes any configured grace period.
    enum:
      - align_with_finalization_date
      - keep_anchor
      - null
    default: null
  payment_provider:
    type:
      - string
      - "null"
    example: stripe
    description: |-
      The payment provider utilized to initiate payments for invoices issued by Lago.
      Accepted values: `stripe`, `adyen`, `cashfree`, `flutterwave`, `gocardless`, `moneyhash` or null. This field is required if you intend to assign a `provider_customer_id`. Send null to detach the customer from its current payment provider.
    enum:
      - stripe
      - adyen
      - cashfree
      - flutterwave
      - gocardless
      - moneyhash
      - null
  payment_provider_code:
    type:
      - string
      - "null"
    example: stripe-eu-1
    description: Unique code used to identify a payment provider connection.
  document_locale:
    type:
      - string
      - "null"
    example: fr
    description: The document locale, specified in the ISO 639-1 format. This field represents the language or locale used for the documents issued by Lago
  provider_payment_methods:
    type:
      - array
      - "null"
    items:
      type: string
    description: Specifies the available payment methods that can be used for this customer when `payment_provider` is set to `stripe`. The `provider_payment_methods` field is an array that allows multiple payment options to be defined. If this field is not explicitly set, the payment methods will be set to `card`. For now, possible values are `card`, `sepa_debit`, `us_bank_account`, `bacs_debit`, `boleto`, `link`, `crypto` and `customer_balance`. Note that when `link` is selected, `card` should also be provided in the array. When `customer_balance` is selected, no other payment can be selected.
    example:
      - card
      - sepa_debit
      - us_bank_account
      - bacs_debit
      - link
      - boleto
      - crypto
      - customer_balance
