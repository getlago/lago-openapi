type: object
required:
  - status
  - error
  - message
  - event
properties:
  status:
    type: integer
    description: HTTP status code. It will always be 422
    example: 422
  error:
    type: string
    description: HTTP error description. It will always be "Unprocessable entity"
    example: Unprocessable entity
  message:
    type: string
    description: The validation errors that were detected on the event, serialized as a JSON string.
    example: '{"target_wallet_code":["target_wallet_code_not_found"]}'
  event:
    $ref: "./EventObject.yaml"
