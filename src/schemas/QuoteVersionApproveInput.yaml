type: object
description: Parameters available when approving a quote version.
required: []
properties:
  expires_at:
    type: string
    format: "date-time"
    description: >-
      The date and time in UTC (ISO 8601) when the order form generated by the
      approval expires. It must be in the future, and must fall strictly before
      the day the quoted deal stops being executable, otherwise the approval is
      rejected with a `422`. That boundary is the earliest of the version's
      `end_date`, the `endDate` of any quoted plan, and the `expirationAt` of any
      quoted wallet credit or recurring top-up rule. A `one_off` quote carries no
      plan or wallet dates, so it is bounded by its `end_date` alone, and is
      unbounded when that is unset too. When `expires_at` is omitted, the order
      form never expires.
    example: "2026-06-30T23:59:59Z"
