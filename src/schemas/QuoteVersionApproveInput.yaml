type: object
description: Parameters available when approving a quote version.
required: []
properties:
  expires_at:
    type: string
    format: "date-time"
    description: The date and time in UTC (ISO 8601) when the order form generated by the approval expires. It must be in the future. When it is omitted, the order form never expires.
    example: "2026-06-30T23:59:59Z"
