type: object
required:
  - webhook_endpoint
properties:
  webhook_endpoint:
    type: object
    required:
      - webhook_url
    properties:
      webhook_url:
        type: string
        description: The URL of the webhook endpoint. It must be an HTTP or HTTPS URL with a host, and it must be unique within the organization.
        example: "https://foo.bar"
      signature_algo:
        type:
          - string
          - "null"
        description: The algorithm used to sign the webhook payload. Defaults to `jwt` when no value is passed.
        default: jwt
        example: "hmac"
        enum:
          - jwt
          - hmac
          - null
      name:
        type:
          - string
          - "null"
        description: The name of the webhook endpoint.
        example: EC2-production
      event_types:
        type:
          - array
          - "null"
        description: The list of event types sent to this webhook endpoint. Pass `null` or `["*"]` to receive every event type. An empty array stops every delivery. Values are trimmed, lowercased and deduplicated, and an unsupported event type is rejected.
        items:
          type: string
        example: ["invoice.voided", "customer.created"]
