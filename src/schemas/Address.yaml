type: object
description: The shipping address of the customer.
properties:
  address_line1:
    type:
      - string
      - "null"
    example: "5230 Penfield Ave"
    description: "The first line of the shipping address"
  address_line2:
    type:
      - string
      - "null"
    example: null
    description: "The second line of the shipping address"
  city:
    type:
      - string
      - "null"
    example: "Woodland Hills"
    description: The city of the customer's shipping address
  country:
    $ref: "./CountryOrNull.yaml"
    description: Country code of the customer's shipping address. Format must be ISO 3166 (alpha-2)
    example: "US"
  state:
    type:
      - string
      - "null"
    example: "CA"
    description: The state of the customer's shipping address
  zipcode:
    type:
      - string
      - "null"
    example: "91364"
    description: The zipcode of the customer's shipping address
