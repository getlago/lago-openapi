type: object
required:
  - month
  - amount_cents
  - currency
  - invoices_count
  - billing_entity_id
properties:
  month:
    type: string
    description: Identifies the month to analyze revenue.
    example: '2023-11-01T00:00:00.000Z'
  amount_cents:
    type: integer
    description: The total amount of revenue for a period, expressed in cents.
    example: 50000
  currency:
    $ref: './Currency.yaml'
    description: The currency of revenue analytics. Format must be ISO 4217.
    example: 'USD'
  invoices_count:
    type: integer
    description: Contains invoices count.
    example: 10
  billing_entity_id:
    type: string
    format: "uuid"
    description: Unique identifier assigned to the billing entity the revenue is attributed to, created by Lago.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
