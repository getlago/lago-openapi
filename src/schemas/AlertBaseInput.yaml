type: object
properties:
  code:
    type: string
    description: Unique code used to identify the alert.
    example: "storage_threshold_alert"
  name:
    type:
      - string
      - "null"
    description: The name of the alert.
    example: "Storage Usage Alert"
  thresholds:
    type: array
    description: Array of thresholds associated with the alert. An alert accepts at most 20 thresholds, and a larger array returns a `422` error with `too_many_thresholds` on `thresholds`. Two thresholds cannot share the same value and the same `recurring` flag. The value of a recurring threshold must be positive.
    items:
      $ref: "./AlertThresholdInput.yaml"
