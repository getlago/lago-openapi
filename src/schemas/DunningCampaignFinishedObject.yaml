type: object
required:
  - external_customer_id
  - dunning_campaign_code
  - overdue_balance_cents
  - overdue_balance_currency
  - overdue_balances
properties:
  external_customer_id:
    type: string
    description: The customer external unique identifier (provided by your own application).
    example: "cus_0987654321"
  dunning_campaign_code:
    type: string
    description: Unique code used to identify the dunning campaign that finished.
    example: "dun_code_1234"
  overdue_balance_cents:
    type: integer
    description: The overdue balance held in the customer currency, expressed in cents. Use `overdue_balances` for the amounts held in the other currencies.
    example: 120
  overdue_balance_currency:
    $ref: "./Currency.yaml"
    description: The currency of the customer, which is the currency of `overdue_balance_cents`.
    example: "EUR"
  overdue_balances:
    type: array
    description: Overdue balance broken down per currency.
    items:
      $ref: "./OverdueBalancePerCurrencyObject.yaml"
