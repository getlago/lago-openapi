type: object
required:
  - applied_coupon
properties:
  applied_coupon:
    type: object
    required:
      - external_customer_id
      - coupon_code
    properties:
      external_customer_id:
        type: string
        description: The customer external unique identifier (provided by your own application)
        example: "5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba"
      coupon_code:
        type: string
        description: Unique code used to identify the coupon.
        example: "startup_deal"
      frequency:
        type:
          - string
          - "null"
        enum:
          - once
          - recurring
          - forever
          - null
        description: |-
          The type of frequency for the coupon. It can have three possible values: `once`, `recurring` or `forever`.

          - If set to `once`, the coupon is applicable only for a single use.
          - If set to `recurring`, the coupon can be used multiple times for recurring billing periods.
          - If set to `forever`, the coupon has unlimited usage and can be applied indefinitely.

          If it is not set, the frequency of the coupon is used.
        example: recurring
      frequency_duration:
        type:
          - integer
          - "null"
        description: The number of billing periods to which the coupon applies. If it is not set, the frequency duration of the coupon is used. A `recurring` applied coupon must end up with a frequency duration greater than 0.
        example: 3
      amount_cents:
        type:
          - integer
          - "null"
        description: The amount of the coupon in cents. If it is not set, the amount of the coupon is used.
        example: 2000
      amount_currency:
        $ref: "./CurrencyOrNull.yaml"
        description: The currency of the coupon amount. If it is not set, the currency of the coupon is used.
        example: "EUR"
      percentage_rate:
        type:
          - string
          - "null"
        pattern: "^[0-9]+.?[0-9]*$"
        description: The percentage rate of the coupon. If it is not set, the percentage rate of the coupon is used.
        example: null
