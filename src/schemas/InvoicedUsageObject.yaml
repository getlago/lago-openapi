type: object
required:
  - month
  - code
  - amount_cents
  - currency
properties:
  month:
    type: string
    format: "date-time"
    description: The month the invoiced usage is reported for, returned as the first instant of that month in UTC.
    example: '2023-11-01T00:00:00.000Z'
  code:
    type: string
    description: The code of the billable metric the usage fees were charged for.
    example: 'code1'
  amount_cents:
    type: integer
    description: The total invoiced usage for the month and the billable metric, expressed in cents. It excludes taxes and is net of coupons.
    example: 50000
  currency:
    $ref: './Currency.yaml'
    description: The currency of revenue analytics. Format must be ISO 4217.
    example: 'USD'
