type: object
required:
  - month
  - payment_status
  - invoices_count
  - amount_cents
  - currency
properties:
  month:
    type: string
    description: Identifies the month of the invoice issuing date.
    example: '2023-11-01T00:00:00.000Z'
  payment_status:
    type:
      - string
      - "null"
    enum:
      - pending
      - succeeded
      - failed
      - null
    description: The payment status of the finalized invoices counted in this row. It is `null` for a month without finalized invoices.
    example: succeeded
  invoices_count:
    type: integer
    description: The number of finalized invoices issued during the month with this payment status.
    example: 10
  amount_cents:
    type: integer
    description: The total amount of the finalized invoices counted in this row, expressed in cents.
    example: 50000
  currency:
    oneOf:
      - $ref: './Currency.yaml'
      - type: "null"
    description: The currency of the finalized invoices counted in this row. Format must be ISO 4217. It is `null` for a month without finalized invoices.
    example: 'USD'
