type: object
required:
  - lago_id
  - lago_quote_id
  - lago_organization_id
  - version
  - status
  - currency
  - start_date
  - end_date
  - void_reason
  - approved_at
  - voided_at
  - created_at
  - updated_at
properties:
  lago_id:
    type: string
    format: "uuid"
    description: Unique identifier of the quote version, created by Lago.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
  lago_quote_id:
    type: string
    format: "uuid"
    description: Unique identifier of the quote the version belongs to, created by Lago.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
  lago_organization_id:
    type: string
    format: "uuid"
    description: Unique identifier of the organization, created by Lago.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
  version:
    type: integer
    description: The number of the version within the quote. It starts at 1 and increases by 1 for every new version created by cloning.
    example: 1
  status:
    $ref: "./QuoteVersionStatusEnum.yaml"
  currency:
    $ref: "./CurrencyOrNull.yaml"
    description: The currency the version is quoted in.
  start_date:
    type:
      - string
      - "null"
    format: "date"
    description: The date the commercial term starts on. The subscriptions created from the version fall back to it when they carry no start date of their own.
    example: "2026-01-01"
  end_date:
    type:
      - string
      - "null"
    format: "date"
    description: The date the commercial term ends on. It is `null` for an open-ended deal. The subscriptions created from the version fall back to it when they carry no end date of their own.
    example: "2027-01-01"
  void_reason:
    $ref: "./QuoteVersionVoidReasonEnum.yaml"
  approved_at:
    type:
      - string
      - "null"
    format: "date-time"
    description: The date and time in UTC (ISO 8601) when the version was approved. It is `null` unless the `status` is `approved`.
    example: "2026-04-29T08:59:51Z"
  voided_at:
    type:
      - string
      - "null"
    format: "date-time"
    description: The date and time in UTC (ISO 8601) when the version was voided. It is `null` unless the `status` is `voided`.
    example: "2026-04-29T08:59:51Z"
  created_at:
    type: string
    format: "date-time"
    description: The date and time in UTC (ISO 8601) when the version was created.
    example: "2026-04-29T08:59:51Z"
  updated_at:
    type: string
    format: "date-time"
    description: The date and time in UTC (ISO 8601) when the version was last updated.
    example: "2026-04-29T08:59:51Z"
