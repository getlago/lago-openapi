type: object
required:
  - webhook_endpoint
properties:
  webhook_endpoint:
    type: object
    properties:
      webhook_url:
        type: string
        description: The URL of the webhook endpoint. It must be unique within the organization.
        example: "https://foo.bar"
      signature_algo:
        type:
          - string
          - "null"
        description: |-
          The algorithm used to sign the webhook payload. When the field is omitted, the current value is kept.
          `standard_webhooks` is in beta and not yet available to every organization: an organization that does not have it gets a `422` error with `value_is_invalid` on `signature_algo`.
          Switching to `standard_webhooks` creates the endpoint's signing key, or reuses the key it kept from an earlier switch.
        example: "hmac"
        enum:
          - jwt
          - hmac
          - standard_webhooks
          - null
      name:
        type:
          - string
          - "null"
        description: The name of the webhook endpoint.
        example: EC2-production
      event_types:
        type:
          - array
          - "null"
        description: The list of event types sent to this webhook endpoint. Pass `null` or `["*"]` to receive every event type. An empty array stops every delivery.
        items:
          type: string
        example: ["invoice.voided", "customer.created"]
