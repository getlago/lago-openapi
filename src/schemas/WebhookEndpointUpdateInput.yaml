type: object
properties:
  webhook_endpoint:
    type: object
    properties:
      webhook_url:
        type: string
        description: The URL of the webhook endpoint.
        example: "https://foo.bar"
      signature_algo:
        type:
          - string
          - "null"
        description: The algorithm used to sign the webhook payload. When the field is omitted, the current value is kept.
        example: "hmac"
        enum:
          - jwt
          - hmac
          - null
      name:
        type:
          - string
          - "null"
        description: The name of the webhook.
        example: EC2-production
      event_types:
        type:
          - array
          - "null"
        description: A list of event types that will trigger the webhook. Passing null means that all event types will be sent.
        items:
          type: string
        example: ["invoice.voided", "customer.created"]
