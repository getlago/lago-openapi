type: object
required:
  - api_version
  - client
  - http_method
  - http_status
  - logged_at
  - request_body
  - request_origin
  - request_path
  - created_at
  - request_id
  - request_response
properties:
  api_version:
    type: string
    example: "v1"
    description: Lago API version used in the request.
  client:
    type: string
    example: "Lago Ruby v1.26.0"
    description: The client that made the request, as reported by its user agent.
  http_method:
    type: string
    example: "post"
    enum:
      - post
      - put
      - patch
      - delete
    description: The HTTP method of the request. Requests made with the GET method are not logged.
  http_status:
    type: integer
    example: 200
    description: The HTTP status Lago returned for the request.
  logged_at:
    type: string
    format: "date-time"
    example: "2025-03-31T12:31:44Z"
    description: The date when the request was logged, presented in the ISO 8601 datetime format, specifically in Coordinated Universal Time (UTC).
  request_body:
    type: object
    additionalProperties: true
    description: The parameters of the request, keyed by their top-level name. Nested values are returned JSON-encoded. When the log is too large to be stored, this object is replaced by a `truncated` key set to `"true"` and an `original_bytesize` key holding the size of the log before truncation.
    example: { "billable_metric": "{\"name\":\"Storage\",\"code\":\"storage\"}" }
  request_origin:
    type: string
    description: The base URL the request was sent to.
    example: "https://api.getlago.com"
  request_path:
    type: string
    description: The path of the request.
    example: "/api/v1/billable_metrics"
  created_at:
    type: string
    format: "date-time"
    example: "2022-04-29T08:59:51Z"
    description: The creation date of the API log record in the Lago application, presented in the ISO 8601 datetime format, specifically in Coordinated Universal Time (UTC).
  request_id:
    type: string
    description: Unique identifier of the API log. It is the identifier of the request, taken from the `X-Request-Id` header when the request carries one, and generated by Lago otherwise.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
  request_response:
    type:
      - object
      - "null"
    additionalProperties: true
    description: The body Lago returned for the request, keyed by its top-level name. Nested values are returned JSON-encoded. It is `null` when the response had no body. When the log is too large to be stored, this object is replaced by a `truncated` key set to `"true"` and an `original_bytesize` key holding the size of the log before truncation.
    example: { "billable_metric": "{\"lago_id\":\"b9155544-e261-4e92-b54e-f65d7609294c\"}" }
