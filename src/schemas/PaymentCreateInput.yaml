type: object
required:
  - payment
properties:
  payment:
    type: object
    required:
      - invoice_id
      - amount_cents
      - reference
    properties:
      invoice_id:
        type: string
        format: uuid
        example: "486b147a-02a1-4ccf-8603-f3541fc25e7a"
        description: Unique identifier of the invoice the payment is recorded on, created by Lago.
      amount_cents:
        type: integer
        minimum: 1
        example: 100
        description: The payment amount in cents. It must be greater than zero.
      reference:
        type: string
        maxLength: 40
        example: "ref1"
        description: Reference for the payment, such as the bank transfer or cheque number.
      paid_at:
        type: string
        format: date
        example: "2025-02-20"
        description: The date the payment was made. It is returned as the payment's `created_at`. When omitted, the date and time of the request is used.
