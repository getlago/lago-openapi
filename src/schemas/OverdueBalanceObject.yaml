type: object
required:
  - month
  - amount_cents
  - currency
  - lago_invoice_ids
  - billing_entity_id
properties:
  month:
    type: string
    description: Identifies the month of the payment due date of the overdue invoices.
    example: '2023-11-01T00:00:00.000Z'
  amount_cents:
    type: integer
    description: The amount still due for this month, expressed in cents. It is the total of the overdue invoices minus the amounts already paid and minus the credits applied by finalized credit notes.
    example: 50000
  currency:
    $ref: './Currency.yaml'
    description: The currency of the overdue invoices. Format must be ISO 4217.
    example: 'USD'
  lago_invoice_ids:
    type: array
    items:
      type: string
      format: uuid
    description: Unique identifiers of the overdue invoices included in this amount, created by Lago.
    example: ['5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba']
  billing_entity_id:
    type: string
    format: "uuid"
    description: Unique identifier assigned to the billing entity the overdue balance is attributed to, created by Lago.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
