type: object
required:
  - month
  - amount_cents
  - currency
  - lago_invoice_ids
  - billing_entity_id
properties:
  month:
    type: string
    description: Identifies the month to analyze revenue.
    example: '2023-11-01T00:00:00.000Z'
  amount_cents:
    type: integer
    description: The total amount of revenue for a period, expressed in cents.
    example: 50000
  currency:
    $ref: './Currency.yaml'
    description: The currency of revenue analytics. Format must be ISO 4217.
    example: 'USD'
  lago_invoice_ids:
    type: array
    items:
      type: string
      format: uuid
    description: The Lago invoice IDs associated with the revenue.
    example: ['5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba']
  billing_entity_id:
    type: string
    format: "uuid"
    description: Unique identifier assigned to the billing entity the overdue balance is attributed to, created by Lago.
    example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
