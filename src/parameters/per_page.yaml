name: per_page
in: query
description: Number of records per page. Defaults to 100. The maximum is 200, unless another maximum is configured for your organization. A value above the maximum returns a `422` error with `value_is_out_of_range` on `per_page`. A value that is not a positive integer, such as `0`, returns the default number of records.
required: false
explode: true
schema:
  type: integer
  example: 20
