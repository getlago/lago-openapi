name: "X-Lago-Signature"
in: header
description: |-
  Signature of the webhook payload, sent only to endpoints that use the `jwt` or `hmac` signature algorithm.
  The format depends on `X-Lago-Signature-Algorithm`:
  `hmac` is the Base64 encoding of an HMAC-SHA256 digest of the payload,
  `jwt` is an RS256 JSON Web Token (a string starting with `eyJ`).
required: false
schema:
  type: string
  example: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
