name: payment_method_type[]
in: query
description: Filter by any of `card`, `sepa_debit`, `us_bank_account`, `bacs_debit`, `link`, `boleto`, `crypto` or `customer_balance`, using the payment provider method data and falling back to the saved payment method when its type is empty; a single value can also be sent as `payment_method_type=card`.
required: false
style: form
explode: true
schema:
  type: array
  items:
    type: string
    enum:
      - card
      - sepa_debit
      - us_bank_account
      - bacs_debit
      - link
      - boleto
      - crypto
      - customer_balance
  example:
    - card
    - sepa_debit
