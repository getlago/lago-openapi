post:
  operationId: quoteCreated
  summary: A new quote has been created
  description: |-
    A new quote has been created. The payload names the initial `draft` version of the quote, numbered 1.
    This is a premium feature.
  parameters:
    - $ref: "../parameters/webhook_signature.yaml"
    - $ref: "../parameters/webhook_signature_algorithm.yaml"
    - $ref: "../parameters/webhook_unique_key.yaml"
  requestBody:
    description: Details of the new quote
    content:
      application/json:
        schema:
          type: object
          required:
            - webhook_type
            - object_type
            - organization_id
            - quote
          properties:
            webhook_type:
              type: string
              enum:
                - quote.created
            object_type:
              type: string
              enum:
                - quote
            organization_id:
              type: string
              format: "uuid"
              description: Unique identifier of the organization, created by Lago.
              example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
            quote:
              $ref: "../schemas/QuoteWithVersionObject.yaml"
  responses:
    "200":
      description: Return a 200 status to indicate that the data was received successfully
