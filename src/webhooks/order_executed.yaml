post:
  operationId: orderExecuted
  summary: An order has been executed
  description: |-
    An order has been carried out, and what it produced is listed in `execution_record`. For an `execute_in_lago` order that means the subscriptions, coupons, wallets or one-off invoice the quote described; an `order_only` order records the mode and the timestamp alone.
    It is emitted on success only: a failed attempt is rolled back and leaves the order in the `failed` status with the reasons in `execution_record.errors`, without emitting anything.
    The `billing_snapshot` returned by the REST endpoints is omitted from this payload, being a heavy blob; retrieve the order to get it.
    This is a premium feature.
  parameters:
    - $ref: "../parameters/webhook_signature.yaml"
    - $ref: "../parameters/webhook_signature_algorithm.yaml"
    - $ref: "../parameters/webhook_unique_key.yaml"
  requestBody:
    description: Details of the executed order
    content:
      application/json:
        schema:
          type: object
          required:
            - webhook_type
            - object_type
            - organization_id
            - order
          properties:
            webhook_type:
              type: string
              enum:
                - order.executed
            object_type:
              type: string
              enum:
                - order
            organization_id:
              type: string
              format: "uuid"
              description: Unique identifier of the organization, created by Lago.
              example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
            order:
              $ref: "../schemas/OrderObject.yaml"
  responses:
    "200":
      description: Return a 200 status to indicate that the data was received successfully
