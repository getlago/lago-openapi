post:
  operationId: addOnDeleted
  summary: An add-on has been deleted
  description: An add-on has been deleted
  parameters:
    - $ref: "../parameters/webhook_signature.yaml"
    - $ref: "../parameters/webhook_signature_algorithm.yaml"
    - $ref: "../parameters/webhook_unique_key.yaml"
  requestBody:
    description: Details of the add-on
    content:
      application/json:
        schema:
          type: object
          required:
            - webhook_type
            - object_type
            - organization_id
            - add_on
          properties:
            webhook_type:
              type: string
              enum:
                - add_on.deleted
            object_type:
              type: string
              enum:
                - add_on
            organization_id:
              type: string
              format: "uuid"
              description: Unique identifier of the organization, created by Lago.
              example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
            add_on:
              $ref: "../schemas/AddOnObject.yaml"
  responses:
    "200":
      description: Return a 200 status to indicate that the data was received successfully
