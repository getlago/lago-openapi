post:
  operationId: quoteApproved
  summary: A quote has been approved
  description: |-
    A version of a quote has been approved. An order form is generated from it in the same transaction, so an `order_form.created` event follows.
    This is a premium feature.
  parameters:
    - $ref: "../parameters/webhook_signature.yaml"
    - $ref: "../parameters/webhook_signature_algorithm.yaml"
    - $ref: "../parameters/webhook_unique_key.yaml"
  requestBody:
    description: Details of the approved quote
    content:
      application/json:
        schema:
          type: object
          required:
            - webhook_type
            - object_type
            - organization_id
            - quote
          properties:
            webhook_type:
              type: string
              enum:
                - quote.approved
            object_type:
              type: string
              enum:
                - quote
            organization_id:
              type: string
              format: "uuid"
              description: Unique identifier of the organization, created by Lago.
              example: "1a901a90-1a90-1a90-1a90-1a901a901a90"
            quote:
              $ref: "../schemas/QuoteWithVersionObject.yaml"
  responses:
    "200":
      description: Return a 200 status to indicate that the data was received successfully
