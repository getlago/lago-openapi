name: Validate OpenAPI schema - openapi-spec-validator

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install "openapi-spec-validator"
      - name: Ensure both bundles are up-to-date
        run: |
          cp openapi.yaml "$RUNNER_TEMP/openapi-v1-before.yaml"
          cp openapi-v2.yaml "$RUNNER_TEMP/openapi-v2-before.yaml"
          npm ci
          npm run build
          diff openapi.yaml "$RUNNER_TEMP/openapi-v1-before.yaml"
          diff openapi-v2.yaml "$RUNNER_TEMP/openapi-v2-before.yaml"

      - name: Lint both specifications
        run: npx redocly lint

      - name: Run tests
        run: |
          python -m openapi_spec_validator "openapi.yaml"
          python -m openapi_spec_validator "openapi-v2.yaml"
