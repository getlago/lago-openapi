name: Validate OpenAPI schema - openapi-spec-validator

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install "openapi-spec-validator"
      - name: Ensure ./openapi.yaml is up-to-date
        run: |
          cp openapi.yaml openapi-before.yaml
          cp openapi-v2.yaml openapi-v2-before.yaml
          npm install
          npm run build
          diff openapi.yaml openapi-before.yaml
          diff openapi-v2.yaml openapi-v2-before.yaml

      - name: Run tests
        run: |
          python -m openapi_spec_validator "openapi.yaml"
          python -m openapi_spec_validator "openapi-v2.yaml"
