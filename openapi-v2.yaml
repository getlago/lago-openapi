        - credit_note
      properties:
        credit_note:
          type: object
          minProperties: 1
          properties:
            refund_status:
              type:
                - string
                - 'null'
              description: Refund status.
              example: pending
              enum:
                - pending
                - succeeded
                - failed
                - null
            metadata:
              type:
                - object
                - 'null'
              description: Metadata as an object of key-value pairs.
              additionalProperties: true
    CreditNoteEstimateInput:
      type: object
      description: Estimate a credit note.
      required:
        - credit_note
      properties:
        credit_note:
          type: object
          description: Invoice and fee credits.
          required:
            - invoice_id
            - items
          properties:
            invoice_id:
              type: string
              description: Invoice identifier.
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              format: uuid
            items:
              type: array
              description: Fees to credit.
              items:
                $ref: '#/components/schemas/CreditNoteItemInput'
    EstimatedCreditNoteObject:
      type: object
      description: An estimate, not a persisted credit note.
      required:
        - lago_invoice_id
        - invoice_number
        - currency
        - sub_total_excluding_taxes_amount_cents
        - taxes_amount_cents
        - sub_total_including_taxes_amount_cents
        - total_amount_cents
        - max_creditable_amount_cents
        - max_refundable_amount_cents
        - items
        - applied_taxes
      properties:
        lago_invoice_id:
          type: string
          description: Invoice identifier.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        invoice_number:
          type: string
          description: Invoice number.
          example: INV-001
        currency:
          type: string
          description: Currency as an ISO 4217 code.
          example: USD
        sub_total_excluding_taxes_amount_cents:
          type: integer
          description: Estimated amount excluding tax, in cents.
          example: 100
        taxes_amount_cents:
          type: integer
          description: Estimated tax amount, in cents.
          example: 20
        sub_total_including_taxes_amount_cents:
          type: integer
          description: Estimated amount including tax, in cents.
          example: 120
        total_amount_cents:
          type: integer
          description: Estimated total amount, in cents.
          example: 120
        max_creditable_amount_cents:
          type: integer
          description: Maximum amount that can be credited, in cents.
          example: 120
        max_refundable_amount_cents:
          type: integer
          description: Maximum refundable amount, in cents.
          example: 120
