  /contracts:
    get:
      tags:
        - contracts
      summary: List contracts
      description: |-
        Returns a cursor-paginated list ordered by creation time, newest first. Use after or before to navigate. The page and per_page parameters are rejected.

        Requires the product catalog to be enabled and contract read permission on the API key.
      operationId: findAllContracts
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/include_total_count'
        - $ref: '#/components/parameters/created_at_from'
        - $ref: '#/components/parameters/created_at_to'
        - name: search_term
          in: query
          required: false
          description: Searches names and codes.
          schema:
            type: string
            description: Text to search.
            example: example
        - name: status[]
          in: query
          required: false
          description: Statuses to include. Also accepts scalar status. Defaults to active.
          schema:
            type: array
            description: Contract statuses.
            items:
              type: string
              description: Lifecycle status.
              example: pending
              enum:
                - pending
                - active
                - terminated
                - canceled
        - name: plan_code
          in: query
          required: false
          description: Plan code.
          schema:
            type: string
            description: Exact identifier.
            example: example
        - name: external_customer_id
          in: query
          required: false
          description: External customer id.
          schema:
            type: string
            description: Exact identifier.
            example: example
        - name: external_id
          in: query
          required: false
          description: External id.
          schema:
            type: string
            description: Exact identifier.
            example: example
        - name: has_rate_overrides
          in: query
          required: false
          description: Has rate overrides.
          schema:
            type: boolean
            description: Whether the contract has a pricing override.
            example: false
        - name: billing_entity_ids[]
          in: query
          required: false
          description: Billing entity ids[].
          schema:
            type: array
            description: Billing entities.
            items:
              type: string
              description: Billing entity identifier.
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              format: uuid
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractsPaginated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
        - contracts
      summary: Create contract
      description: |-
        Creates a contract for an existing customer. The plan is optional. One pending or active contract may use an external_id at a time. A plan supplies the initial applied rate cards.
        Requires the product catalog to be enabled and contract write permission on the API key.
      operationId: createContract
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /contracts/{external_id}:
    parameters:
      - name: external_id
        in: path
        required: true
        description: External id.
        schema:
          type: string
          description: External id.
          example: external_123
    get:
      tags:
        - contracts
      summary: Retrieve contract
      description: |-
        Without status, retrieves the live pending or active contract. A status can select a historical terminated or canceled contract.
        Requires the product catalog to be enabled and contract read permission on the API key.
      operationId: findContract
      parameters:
        - name: expands[]
          in: query
          required: false
          description: Relationships to include in this response. Only one expansion level is supported.
          schema:
            type: array
            description: Relationships to include.
            items:
              type: string
              enum:
                - applied_rate_cards
                - plan
                - customer
                - invoice_custom_sections
              example: applied_rate_cards
        - name: status
          in: query
          required: false
          description: Selects a lifecycle status. An unknown value falls back to active.
          schema:
            type: string
            description: Lifecycle status.
            example: pending
            enum:
              - pending
              - active
              - terminated
              - canceled
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - contracts
      summary: Update contract
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.
        Identifiers and customer are immutable. Lifecycle status determines which other fields can change.
        Requires the product catalog to be enabled and contract write permission on the API key.
      operationId: updateContract
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
        - contracts
      summary: Update contract
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.
        Identifiers and customer are immutable. Lifecycle status determines which other fields can change.
        Requires the product catalog to be enabled and contract write permission on the API key.
      operationId: patchContract
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - contracts
      summary: Delete contract
      description: |-
        DELETE ends the contract lifecycle; it does not delete the record. Active contracts are terminated and pending contracts are canceled.
        Requires the product catalog to be enabled and contract write permission on the API key.
      operationId: destroyContract
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /contracts/{external_id}/current_usage:
    parameters:
      - name: external_id
        in: path
        required: true
        description: External id.
        schema:
          type: string
          description: External id.
          example: external_123
    get:
      tags:
        - contracts
      summary: Retrieve contract current usage
      description: |-
        Returns usage across the open billing windows of the active or pending contract. Pending contracts have no usage. Totals may span multiple invoices.
        Requires the product catalog to be enabled and customer_usage read permission on the API key.
      operationId: findContractCurrentUsage
      parameters:
        - name: apply_taxes
          in: query
          required: false
          description: Apply taxes.
          schema:
            type: boolean
            description: Whether to include tax calculation.
            example: true
            default: true
        - name: rate_card_code
          in: query
          required: false
          description: Rate card code.
          schema:
            type: string
            description: Exact code.
            example: example_code
        - name: product_code
          in: query
          required: false
          description: Product code.
          schema:
            type: string
            description: Exact code.
            example: example_code
        - name: product_filter_code
          in: query
          required: false
          description: Product filter code.
          schema:
            type: string
            description: Exact code.
            example: example_code
        - name: product_type
          in: query
          required: false
          description: Product type.
          schema:
            type: string
            description: Type of product. Metered products require a billable metric; fixed products must not reference one.
            example: metered
            enum:
              - metered
              - fixed
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of records per page. Values outside the supported range return 400.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    after:
      name: after
      in: query
      description: Opaque next_cursor from a previous response. Returns the next page. Cannot be combined with before or include_total_count=true. Keep the same filters when paging.
      required: false
      schema:
        type: string
        example: eyJ2IjoxLCJvIjp7InQiOiJ0YXhlcyIsInMiOiJjcmVhdGVkX2F0OmRlc2MsaWQ6ZGVzYyJ9LCJrIjpbIjIwMjItMDQtMjlUMDg6NTk6NTEuMDAwMDAwWiIsIjFhOTAxYTkwLTFhOTAtMWE5MC0xYTkwLTFhOTAxYTkwMWE5MCJdfQ
    before:
      name: before
      in: query
      description: Opaque prev_cursor from a previous response. Returns the previous page in the same list order. Cannot be combined with after or include_total_count=true. Keep the same filters when paging.
      required: false
      schema:
        type: string
        example: eyJ2IjoxLCJvIjp7InQiOiJ0YXhlcyIsInMiOiJjcmVhdGVkX2F0OmRlc2MsaWQ6ZGVzYyJ9LCJrIjpbIjIwMjItMDQtMjlUMDg6NTk6NTEuMDAwMDAwWiIsIjFhOTAxYTkwLTFhOTAtMWE5MC0xYTkwLTFhOTAxYTkwMWE5MCJdfQ
    include_total_count:
      name: include_total_count
      in: query
      description: Requests the total number of matching records. Supported only on the first page, without after or before. The count can be estimated; total_count_estimated is then present and true.
      required: false
      schema:
        type: boolean
        default: false
        example: true
    created_at_from:
      name: created_at_from
      in: query
      description: Inclusive lower bound on the creation time, as an ISO 8601 date or timestamp. A date starts at midnight UTC. Invalid values return 422.
      required: false
      schema:
        type: string
        example: '2022-04-01T00:00:00Z'
    created_at_to:
      name: created_at_to
      in: query
      description: Inclusive upper bound on the creation time, as an ISO 8601 date or timestamp. A date includes that whole UTC day. Invalid values return 422.
      required: false
      schema:
        type: string
        example: '2022-04-30T23:59:59Z'
  headers:
    EndpointStatus:
      description: Indicates that the endpoint is in beta.
      schema:
        type: string
        enum:
          - beta
        example: beta
  schemas:
    TaxObject:
      type: object
      required:
        - lago_id
        - name
        - code
        - rate
        - description
        - created_at
        - updated_at
        - deleted_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the tax, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        name:
          type: string
          description: Name of the tax.
          example: VAT
        code:
          type: string
          description: Unique code of the tax within the organization.
          example: standard_vat
        rate:
          type: number
          description: Percentage rate of the tax, returned as a JSON number.
          example: 20
        description:
          type:
            - string
            - 'null'
          description: Internal description of the tax.
          example: Standard VAT
        created_at:
          type: string
          format: date-time
          description: UTC creation timestamp, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
        updated_at:
          type: string
          format: date-time
          description: UTC timestamp of the last update, with microsecond precision.
          example: '2022-04-29T09:30:00.123456Z'
        deleted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: UTC deletion timestamp, with microsecond precision. It is null until the tax is deleted.
          example: null
      example:
        lago_id: 1a901a90-1a90-1a90-1a90-1a901a901a90
        name: VAT
        code: standard_vat
        rate: 20
        description: Standard VAT
        created_at: '2022-04-29T08:59:51.123456Z'
        updated_at: '2022-04-29T09:30:00.123456Z'
        deleted_at: null
    CursorPaginationMeta:
      type: object
      required:
        - next_cursor
        - prev_cursor
      dependentRequired:
        total_count_estimated:
          - total_count
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: Opaque cursor to pass as after for the next page. It is null when there is no next page.
          example: null
        prev_cursor:
          type:
            - string
            - 'null'
          description: Opaque cursor to pass as before for the previous page. It is null when there is no previous page.
          example: null
        total_count:
          type: integer
          minimum: 0
          description: Number of matching records, returned only when include_total_count is true on the first page. The count can be estimated.
          example: 42
        total_count_estimated:
          type: boolean
          enum:
            - true
          description: Present and true only when total_count is an estimate. Omitted for an exact count.
          example: true
    TaxesPaginated:
      type: object
      required:
        - taxes
        - meta
      properties:
        taxes:
          type: array
          description: Tax rates on the requested page.
          items:
            $ref: '#/components/schemas/TaxObject'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    ApiError:
      type: object
      required:
        - code
        - details
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Code identifying the failure. The HTTP status is carried by the response, not the body.
          example: validation_errors
        details:
          type: array
          description: Details of the failure. The array is empty when no field details are available.
          items:
            type: object
            required:
              - code
              - field
              - meta
            properties:
              code:
                type: string
                pattern: ^[a-z][a-z0-9_]*$
                description: Code identifying the field error or the reason a request parameter was rejected.
                example: value_is_mandatory
              field:
                type: string
                description: Request field or parameter. Nested fields use dots and zero-based array indexes. A resource-level failure uses base.
                example: name
              meta:
                type: object
                description: Information about the failure, such as the missing resource, allowed values or bounds. The object is empty when no metadata is available.
                additionalProperties: true
                example: {}
                properties:
                  min:
                    type: integer
                    description: Inclusive minimum value.
                    example: 0
                  max:
                    type: integer
                    description: Inclusive maximum value.
                    example: 100
                  min_length:
                    type: integer
                    description: Minimum string length, in characters.
                    example: 1
                  max_length:
                    type: integer
                    description: Maximum string length, in characters.
                    example: 255
                  max_items:
                    type: integer
                    description: Maximum number of items.
                    example: 100
                  allowed_values:
                    type: array
                    description: Values accepted for the field.
                    items:
                      type: string
                      description: Allowed value.
                      example: draft
                  invalid_values:
                    type: array
                    description: Values rejected by request validation.
                    items:
                      type: string
                      description: Rejected value.
                      example: unknown
                  value:
                    type: string
                    description: Query parameter value received.
                    example: unknown
                  resource:
                    type: string
                    description: Resource that could not be found.
                    example: customer
                  provider_name:
                    type: string
                    description: Name of the provider that failed.
                    example: stripe
                  provider_code:
                    type: string
                    description: Code of the provider connection.
                    example: stripe_eu
                  provider_error_code:
                    type: string
                    description: Error code returned by the provider.
                    example: resource_missing
    TaxBaseInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the tax. It cannot be blank.
          example: VAT
        code:
          type: string
          minLength: 1
          description: Unique code of the tax within the organization, including deleted taxes. It cannot be blank.
          example: standard_vat
        rate:
          type:
            - number
            - string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Percentage rate of the tax. Accepts a number or a decimal string.
          example: 20
        description:
          type:
            - string
            - 'null'
          description: Internal description of the tax. Set to null to clear it.
          example: Standard VAT
    TaxCreateInput:
      type: object
      required:
        - tax
      properties:
        tax:
          allOf:
            - $ref: '#/components/schemas/TaxBaseInput'
            - type: object
              required:
                - name
                - code
                - rate
    Tax:
      type: object
      required:
        - tax
      properties:
        tax:
          $ref: '#/components/schemas/TaxObject'
    TaxUpdateInput:
      type: object
      required:
        - tax
      properties:
        tax:
          $ref: '#/components/schemas/TaxBaseInput'
    ProductCategoryObject:
      type: object
      description: Product Category.
      required:
        - lago_id
        - name
        - code
        - description
        - invoice_display_name
        - created_at
        - updated_at
        - deleted_at
      properties:
        lago_id:
          type: string
          description: Unique identifier created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        name:
          type: string
          description: Name.
          example: example
        code:
          type: string
          description: Code.
          example: example
        description:
          type:
            - string
            - 'null'
          description: Description.
          example: example
        invoice_display_name:
          type:
            - string
            - 'null'
          description: Invoice display name.
          example: example
        created_at:
          type: string
          description: UTC creation timestamp, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        updated_at:
          type: string
          description: UTC timestamp of the last update, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        deleted_at:
          type:
            - string
            - 'null'
          description: UTC deletion timestamp, with microsecond precision. Null until deletion.
          example: null
          format: date-time
    ProductCategoriesPaginated:
      type: object
      description: product categories list.
      required:
        - product_categories
        - meta
      properties:
        product_categories:
          type: array
          description: Records in this response.
          items:
            $ref: '#/components/schemas/ProductCategoryObject'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    ProductCategoryBaseInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          description: Name shown in the catalog.
          example: Compute
        code:
          type: string
          description: Unique code within the organization.
          example: example_code
          pattern: ^(?!\.+$)[a-zA-Z0-9_\-.]+$
        description:
          type:
            - string
            - 'null'
          description: Internal description.
          example: Compute charges.
        invoice_display_name:
          type:
            - string
            - 'null'
          description: Name used on invoices. Defaults to the name when blank.
          example: Compute
    ProductCategoryCreateInput:
      type: object
      description: Create product category.
      required:
        - product_category
      properties:
        product_category:
