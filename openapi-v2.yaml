    WebhookEndpointSigningKeyObject:
      type: object
      description: Webhook endpoint signing key.
      required:
        - lago_id
        - secret_key
        - created_at
      properties:
        lago_id:
          type: string
          description: Unique identifier created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        secret_key:
          type: string
          pattern: ^whsec_
          description: Secret key to set up a Standard Webhooks library with, prefixed with `whsec_`.
          example: whsec_ZmFrZS1zZWNyZXQtZm9yLWRvY3VtZW50YXRpb24tb25seQ==
        created_at:
          type: string
          description: UTC creation timestamp, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
    WebhookEndpointObject:
      type: object
      description: Webhook Endpoint.
      required:
        - lago_id
        - name
        - webhook_url
        - signature_algo
        - event_types
        - created_at
        - updated_at
      properties:
        lago_id:
          type: string
          description: Unique identifier created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        name:
          type:
            - string
            - 'null'
          description: Name.
          example: example
        webhook_url:
          type: string
          description: Public URL receiving webhook requests.
          example: https://hooks.acme.example/lago
          format: uri
        signature_algo:
          type: string
          description: Webhook signature algorithm.
          example: standard_webhooks
          enum:
            - standard_webhooks
        event_types:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/WebhookEventTypeEnum'
          description: Event types delivered to this endpoint. Null means all events; an empty array selects none.
        created_at:
          type: string
          description: UTC creation timestamp, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        updated_at:
          type: string
          description: UTC timestamp of the last update, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        signing_keys:
          type: array
          description: Signing keys of the endpoint, oldest first, used to verify the webhook-signature header of `standard_webhooks` deliveries. Included only with expands[]=signing_keys.
          items:
            $ref: '#/components/schemas/WebhookEndpointSigningKeyObject'
    WebhookEndpointsPaginated:
      type: object
      description: webhook endpoints list.
      required:
        - webhook_endpoints
        - meta
      properties:
        webhook_endpoints:
          type: array
          description: Records in this response.
          items:
            $ref: '#/components/schemas/WebhookEndpointObject'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    WebhookEndpointBaseInput:
      type: object
      minProperties: 1
      properties:
        name:
          type:
            - string
            - 'null'
          description: Endpoint name.
          example: Billing webhooks
        webhook_url:
          type: string
          description: Public URL receiving webhook requests. Private addresses are rejected.
          example: https://hooks.acme.example/lago
          format: uri
        signature_algo:
          type: string
          description: Webhook signature algorithm. Only `standard_webhooks` is accepted, and it is the default on create. Another value returns 422 with `value_is_invalid` on `signature_algo` and the accepted algorithms in `allowed_values`. An existing endpoint keeps its algorithm when the field is omitted or sent with its current value.
          example: standard_webhooks
          enum:
            - standard_webhooks
          default: standard_webhooks
        event_types:
          type:
            - array
            - 'null'
          items:
            anyOf:
              - $ref: '#/components/schemas/WebhookEventTypeEnum'
              - type: string
                enum:
                  - '*'
                example: '*'
          description: Event types to deliver. Null or ["*"] selects all events. Names are trimmed, lowercased and deduplicated. An empty array selects none.
    WebhookEndpointCreateInput:
      type: object
      description: Create webhook endpoint.
      required:
        - webhook_endpoint
      properties:
        webhook_endpoint:
          allOf:
            - $ref: '#/components/schemas/WebhookEndpointBaseInput'
            - type: object
              required:
                - webhook_url
    WebhookEndpoint:
      type: object
      description: webhook endpoint response.
      required:
        - webhook_endpoint
      properties:
        webhook_endpoint:
          $ref: '#/components/schemas/WebhookEndpointObject'
    WebhookEndpointUpdateInput:
      type: object
      description: Update webhook endpoint.
      required:
        - webhook_endpoint
      properties:
        webhook_endpoint:
          $ref: '#/components/schemas/WebhookEndpointBaseInput'
  responses:
    BadRequest:
      description: Invalid request body, pagination or relationship expansion
      headers:
        X-Lago-Endpoint-Status:
          $ref: '#/components/headers/EndpointStatus'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: invalid_expand
            details:
              - code: malformed
                field: expands
                meta:
                  allowed_values: []
    Unauthorized:
      description: Missing or invalid API key
      headers:
        X-Lago-Endpoint-Status:
          $ref: '#/components/headers/EndpointStatus'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: unauthorized
            details: []
    Forbidden:
      description: Feature unavailable or insufficient API permissions
      headers:
        X-Lago-Endpoint-Status:
          $ref: '#/components/headers/EndpointStatus'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: feature_unavailable
            details: []
    UnprocessableEntity:
      description: Invalid fields or filters
      headers:
        X-Lago-Endpoint-Status:
          $ref: '#/components/headers/EndpointStatus'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Unknown resource or resource from another organization
      headers:
        X-Lago-Endpoint-Status:
          $ref: '#/components/headers/EndpointStatus'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: resource_not_found
            details:
              - code: resource_not_found
                field: base
                meta:
                  resource: resource_name
    TooManyRequests:
      description: Payment provider rate limit exceeded
      headers:
        X-Lago-Endpoint-Status:
          $ref: '#/components/headers/EndpointStatus'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: too_many_provider_requests
            details:
              - code: too_many_provider_requests
                field: base
                meta:
                  provider_name: stripe
