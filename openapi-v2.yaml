        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /products/{product_code}/filters:
    parameters:
      - name: product_code
        in: path
        required: true
        description: Product code.
        schema:
          type: string
          description: Product code.
          example: example_code
    get:
      tags:
        - product_filters
      summary: List product filters
      description: |-
        Returns a cursor-paginated list ordered by creation time, newest first. Use after or before to navigate. The page and per_page parameters are rejected.

        Requires the product catalog to be enabled and product read permission on the API key.
      operationId: findAllProductFilters
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/include_total_count'
        - $ref: '#/components/parameters/created_at_from'
        - $ref: '#/components/parameters/created_at_to'
        - name: search_term
          in: query
          required: false
          description: Searches names and codes.
          schema:
            type: string
            description: Text to search.
            example: example
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFiltersPaginated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
