        number:
          type: string
          description: Number.
          example: example
        lago_payment_id:
          type: string
          description: Payment identifier.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        pdf_url:
          type:
            - string
