paths:
  /taxes:
    get:
      tags:
        - taxes
      summary: List all taxes
      description: |-
        Lists the organization's taxes, excluding deleted taxes.
        Requires the product catalog to be enabled and tax read permission on the API key.
        Results are ordered by creation time, newest first, with the tax identifier as a tiebreaker.
        Use after or before to navigate. The page and per_page parameters return 400.
        Relationships and assignment counts are not returned. Taxes have no supported expansions; a nonempty expands[] returns 400.
        Invalid date filters return 422.
      operationId: findAllTaxes
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/include_total_count'
        - $ref: '#/components/parameters/created_at_from'
        - $ref: '#/components/parameters/created_at_to'
      responses:
        '200':
          description: Taxes
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxesPaginated'
              example:
                taxes:
                  - lago_id: 1a901a90-1a90-1a90-1a90-1a901a901a90
                    name: VAT
                    code: standard_vat
                    rate: 20
                    description: Standard VAT
                    created_at: '2022-04-29T08:59:51.123456Z'
                    updated_at: '2022-04-29T09:30:00.123456Z'
                    deleted_at: null
                meta:
                  next_cursor: null
                  prev_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
        - taxes
      summary: Create a tax
      description: |-
        Creates a tax rate for the organization.
        Requires the product catalog to be enabled and tax write permission on the API key.
        Name, code and rate are required. A code already used by another tax of the organization, including a deleted one, returns 422.
        The applied_to_organization parameter is ignored and is not returned. Creating a tax does not assign it to any resource.
        Taxes have no supported expansions; a nonempty expands[] returns 400 before creation.
      operationId: createTax
      requestBody:
        required: true
        description: Tax creation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxCreateInput'
            example:
              tax:
                name: VAT
                code: standard_vat
                rate: 20
                description: Standard VAT
      responses:
        '200':
          description: Tax created
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /taxes/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Code of the tax within the organization.
        schema:
          type: string
          example: standard_vat
    get:
      tags:
        - taxes
      summary: Retrieve a tax
      description: |-
        Retrieves a non-deleted tax by its code.
        Requires the product catalog to be enabled and tax read permission on the API key.
        Unknown taxes and taxes belonging to another organization return 404.
        Assignments and relationship counts are not returned. Taxes have no supported expansions; a nonempty expands[] returns 400.
      operationId: findTax
      responses:
        '200':
          description: Tax
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - taxes
      summary: Update a tax
      description: |-
        Updates a non-deleted tax identified by the code in the path.
        Requires the product catalog to be enabled and tax write permission on the API key.
        Both PUT and PATCH accept partial updates. Omitted fields keep their current values.
        The tax wrapper must be nonempty. The code field can rename the tax if no other tax of the organization, including a deleted one, uses the new code.
        The applied_to_organization parameter is ignored and existing assignments are not changed by this parameter.
        Taxes have no supported expansions; a nonempty expands[] returns 400 before updating the tax.
      operationId: updateTax
      requestBody:
        required: true
        description: Tax update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxUpdateInput'
            example:
              tax:
                rate: '5.5'
                description: Reduced VAT
      responses:
        '200':
          description: Tax updated
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
        - taxes
      summary: Partially update a tax
      description: |-
        Updates only the supplied fields of a non-deleted tax identified by its code.
        Requires the product catalog to be enabled and tax write permission on the API key.
        Behaves the same as PUT. The tax wrapper must be nonempty, and omitted fields keep their current values.
        The applied_to_organization parameter is ignored and existing assignments are not changed by this parameter.
        Taxes have no supported expansions; a nonempty expands[] returns 400 before updating the tax.
      operationId: patchTax
      x-lago-cli-action: patch
      requestBody:
        required: true
        description: Tax update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxUpdateInput'
            example:
              tax:
                name: Reduced VAT
      responses:
        '200':
          description: Tax updated
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - taxes
      summary: Delete a tax
      description: |-
        Deletes a tax identified by its code and returns it with a non-null deleted_at timestamp.
        Requires the product catalog to be enabled and tax write permission on the API key.
        Deleted taxes are no longer returned by listing or retrieval. An unknown or already deleted tax returns 404.
        Taxes have no supported expansions; a nonempty expands[] returns 400 before deletion.
      operationId: destroyTax
      responses:
        '200':
          description: Tax deleted
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
              example:
                tax:
                  lago_id: 1a901a90-1a90-1a90-1a90-1a901a901a90
                  name: VAT
                  code: standard_vat
                  rate: 20
                  description: Standard VAT
                  created_at: '2022-04-29T08:59:51.123456Z'
                  updated_at: '2022-04-30T10:00:00.123456Z'
                  deleted_at: '2022-04-30T10:00:00.123456Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /product_categories:
    get:
      tags:
        - product_categories
      summary: List product categories
      description: |-
        Returns a cursor-paginated list ordered by creation time, newest first. Use after or before to navigate. The page and per_page parameters are rejected.

        Requires the product catalog to be enabled and product_category read permission on the API key.
      operationId: findAllProductCategories
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/include_total_count'
        - $ref: '#/components/parameters/created_at_from'
        - $ref: '#/components/parameters/created_at_to'
        - name: search_term
          in: query
          required: false
          description: Searches names and codes.
          schema:
            type: string
            description: Text to search.
            example: example
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoriesPaginated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
        - product_categories
      summary: Create product category
      description: Requires the product catalog to be enabled and product_category write permission on the API key.
      operationId: createProductCategory
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryCreateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /product_categories/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Code.
        schema:
          type: string
          description: Code.
          example: example_code
    get:
      tags:
        - product_categories
      summary: Retrieve product category
      description: |-
        Returns the record without nested relationships unless a supported expansion is requested.
        Requires the product catalog to be enabled and product_category read permission on the API key.
      operationId: findProductCategory
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - product_categories
      summary: Update product category
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.

        Requires the product catalog to be enabled and product_category write permission on the API key.
      operationId: updateProductCategory
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryUpdateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
        - product_categories
      summary: Update product category
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.

        Requires the product catalog to be enabled and product_category write permission on the API key.
      operationId: patchProductCategory
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryUpdateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - product_categories
      summary: Delete product category
      description: |-
        Deletes the category and its products, filters, rate cards and rates. A category attached to a plan or subscription cannot be deleted.
        Requires the product catalog to be enabled and product_category write permission on the API key.
      operationId: destroyProductCategory
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /products:
    get:
      tags:
        - products
      summary: List products
      description: |-
        Returns a cursor-paginated list ordered by creation time, newest first. Use after or before to navigate. The page and per_page parameters are rejected.

        Requires the product catalog to be enabled and product read permission on the API key.
      operationId: findAllProducts
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/include_total_count'
        - $ref: '#/components/parameters/created_at_from'
        - $ref: '#/components/parameters/created_at_to'
        - name: search_term
          in: query
          required: false
          description: Searches names and codes.
          schema:
            type: string
            description: Text to search.
            example: example
        - name: product_category_code[]
          in: query
          required: false
          description: Filter by category codes. A scalar product_category_code is also accepted. Unknown categories return 404.
          schema:
            type: array
            description: Category codes.
            items:
              type: string
              description: Category code.
              example: compute
        - name: without_product_category
          in: query
          required: false
          description: Include uncategorized products, alone or alongside the requested categories.
          schema:
            type: boolean
            description: Include uncategorized products.
            example: false
        - name: product_type
          in: query
          required: false
          description: Product type.
          schema:
            type: string
            description: Type of product. Metered products require a billable metric; fixed products must not reference one.
            example: metered
            enum:
              - metered
              - fixed
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsPaginated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
        - products
      summary: Create product
      description: |-
        Creates a fixed or metered product. Metered products require billable_metric_code; fixed products reject it.
        Requires the product catalog to be enabled and product write permission on the API key.
      operationId: createProduct
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /products/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Code.
        schema:
          type: string
          description: Code.
          example: example_code
    get:
      tags:
        - products
      summary: Retrieve product
      description: |-
        Returns the record without nested relationships unless a supported expansion is requested.
        Requires the product catalog to be enabled and product read permission on the API key.
      operationId: findProduct
      parameters:
        - name: expands[]
          in: query
          required: false
          description: Relationships to include in this response. Only one expansion level is supported.
          schema:
            type: array
            description: Relationships to include.
            items:
              type: string
              enum:
                - product_category
                - billable_metric
              example: product_category
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - products
      summary: Update product
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.
        Product type and billable metric cannot be changed through this endpoint. A blank product_category_code detaches the category.
        Requires the product catalog to be enabled and product write permission on the API key.
      operationId: updateProduct
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
