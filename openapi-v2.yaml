          schema:
            type: string
            description: Search term.
            example: example
        - name: external_customer_id
          in: query
          required: false
          description: External customer id.
          schema:
            type: string
            description: External customer id.
            example: example
        - name: currency
          in: query
          required: false
          description: Currency as an ISO 4217 code.
          schema:
            type: string
            description: Currency as an ISO 4217 code.
            example: example
        - name: invoice_number
          in: query
          required: false
          description: Invoice number.
          schema:
            type: string
            description: Invoice number.
            example: example
        - name: purchase_order_number
          in: query
          required: false
          description: Purchase order number.
