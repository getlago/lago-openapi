        - invoice_number
        - purchase_order_number
        - issuing_date
        - credit_status
        - refund_status
        - reason
        - description
        - currency
        - sub_total_excluding_taxes_amount_cents
        - taxes_amount_cents
        - sub_total_including_taxes_amount_cents
        - total_amount_cents
        - balance_amount_cents
        - credit_amount_cents
        - refund_amount_cents
        - offset_amount_cents
        - file_url
        - xml_url
        - self_billed
        - created_at
        - updated_at
      properties:
        lago_id:
          type: string
          description: Unique identifier created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        billing_entity_code:
          type: string
          description: Code of the invoice billing entity.
          example: main
        sequential_id:
          type: integer
          description: Sequential id.
          example: 1
        number:
          type: string
          description: Number.
          example: example
        lago_invoice_id:
          type: string
          description: Invoice identifier.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        invoice_number:
          type: string
          description: Invoice number.
          example: INV-001
        purchase_order_number:
          type:
            - string
            - 'null'
          description: Purchase order reference.
          example: PO-123
        issuing_date:
          type: string
          description: Issuing date.
          example: '2022-04-29'
          format: date
        credit_status:
          type:
            - string
            - 'null'
          description: Credit balance status.
          example: available
          enum:
            - available
            - consumed
            - voided
            - null
        refund_status:
          type:
            - string
            - 'null'
          description: Refund status.
          example: pending
          enum:
            - pending
            - succeeded
            - failed
            - null
        reason:
          type: string
          description: Reason for issuing the credit note.
          example: duplicated_charge
          enum:
            - duplicated_charge
            - product_unsatisfactory
            - order_change
            - order_cancellation
            - fraudulent_charge
            - other
        description:
          type:
            - string
            - 'null'
          description: Description.
          example: Example
        currency:
          type: string
          description: Currency as an ISO 4217 code.
          example: USD
        sub_total_excluding_taxes_amount_cents:
          type: integer
          description: Credited amount excluding tax, in cents.
          example: 100
        taxes_amount_cents:
          type: integer
          description: Taxes amount cents.
          example: 100
        sub_total_including_taxes_amount_cents:
          type: integer
          description: Credited amount including tax, in cents.
          example: 120
        total_amount_cents:
          type: integer
          description: Total amount cents.
          example: 100
        balance_amount_cents:
          type: integer
          description: Balance amount cents.
          example: 100
        credit_amount_cents:
          type: integer
          description: Credit amount cents.
          example: 100
        refund_amount_cents:
          type: integer
          description: Refund amount cents.
          example: 100
        offset_amount_cents:
          type: integer
          description: Offset amount cents.
          example: 100
        file_url:
          type:
            - string
            - 'null'
          description: Document download URL, or null while the document is unavailable.
          example: https://documents.example/invoice.pdf
          format: uri
        xml_url:
          type:
            - string
            - 'null'
          description: Document download URL, or null while the document is unavailable.
          example: https://documents.example/invoice.pdf
          format: uri
        self_billed:
          type: boolean
          description: Whether the invoice is self-billed.
          example: false
        created_at:
          type: string
          description: UTC creation timestamp, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        updated_at:
          type: string
          description: UTC timestamp of the last update, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        items:
          type: array
          description: Present only with expands[]=items.
          items:
            $ref: '#/components/schemas/CreditNoteItemObject'
        applied_taxes:
          type: array
          description: Present only with expands[]=applied_taxes.
          items:
            $ref: '#/components/schemas/CreditNoteAppliedTaxObject'
        customer:
          $ref: '#/components/schemas/CustomerObject'
          description: Present only with expands[]=customer.
        error_details:
          type: array
          description: Present only with expands[]=error_details. These entries do not include timestamps.
          items:
            $ref: '#/components/schemas/CreditNoteErrorDetailObject'
        metadata:
          type:
            - object
            - 'null'
          description: Present only with expands[]=metadata. Null when no metadata exists.
          additionalProperties: true
    CreditNotesPaginated:
      type: object
      description: credit notes list.
      required:
        - credit_notes
        - meta
      properties:
        credit_notes:
          type: array
          description: Records in this response.
          items:
            $ref: '#/components/schemas/CreditNoteObject'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    CreditNoteItemInput:
      type: object
      description: A fee to credit.
      required:
        - fee_id
        - amount_cents
      properties:
        fee_id:
          type: string
          description: Identifier of a fee belonging to the invoice.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        amount_cents:
          type:
            - number
            - string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Amount in cents, accepted as a number or a decimal string.
          example: 100
    CreditNoteBaseInput:
      type: object
      minProperties: 1
      properties:
        invoice_id:
          type: string
          description: Invoice identifier.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          format: uuid
        reason:
          type: string
          description: Reason for issuing the credit note.
          example: duplicated_charge
          enum:
            - duplicated_charge
            - product_unsatisfactory
            - order_change
            - order_cancellation
            - fraudulent_charge
            - other
          default: other
        description:
          type:
            - string
            - 'null'
          description: Description of the adjustment.
          example: Partial credit
        credit_amount_cents:
          type: integer
          description: Amount credited to the customer balance, in cents.
          example: 100
        refund_amount_cents:
          type: integer
          description: Amount to refund, in cents.
          example: 0
        offset_amount_cents:
          type: integer
          description: Amount offset against the invoice balance, in cents.
          example: 0
        metadata:
          type:
            - object
            - 'null'
          description: Metadata as an object of key-value pairs.
          additionalProperties: true
        items:
          type: array
          description: Invoice fees to credit.
          items:
            $ref: '#/components/schemas/CreditNoteItemInput'
    CreditNoteCreateInput:
      type: object
      description: Create credit note.
      required:
        - credit_note
      properties:
        credit_note:
          $ref: '#/components/schemas/CreditNoteBaseInput'
          required:
            - invoice_id
            - items
    CreditNote:
      type: object
      description: credit note response.
      required:
        - credit_note
      properties:
        credit_note:
          $ref: '#/components/schemas/CreditNoteObject'
    CreditNoteUpdateInput:
      type: object
      description: Update a credit note.
