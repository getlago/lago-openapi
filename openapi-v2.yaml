            description: Text to search.
            example: Acme
        - name: external_id
          in: query
          required: false
          description: External id.
          schema:
            type: string
            description: Exact customer external identifier.
            example: customer_123
        - name: has_tax_identification_number
          in: query
          required: false
          description: Has tax identification number.
          schema:
            type: boolean
            description: Filter customers with or without a tax identifier.
            example: false
        - name: has_customer_type
          in: query
          required: false
          description: Has customer type.
          schema:
            type: boolean
            description: Filter customers with or without a customer type.
            example: false
