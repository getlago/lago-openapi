          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - products
      summary: Delete product
      description: |-
        Deletes the product, its filters, rate cards and rates. Products attached to a plan or subscription cannot be deleted.
        Requires the product catalog to be enabled and product write permission on the API key.
      operationId: destroyProduct
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
