            example: available
            enum:
              - available
              - consumed
              - voided
        - name: refund_status
          in: query
          required: false
          description: Refund status.
          schema:
            type: string
            description: Refund status.
            example: pending
            enum:
              - pending
              - succeeded
              - failed
        - name: reason
          in: query
          required: false
          description: Reason.
          schema:
            type: string
            description: Reason for issuing the credit note.
            example: duplicated_charge
            enum:
              - duplicated_charge
              - product_unsatisfactory
              - order_change
              - order_cancellation
              - fraudulent_charge
              - other
        - name: self_billed
          in: query
          required: false
          description: Self billed.
          schema:
            type: boolean
            description: Whether the invoice is self-billed.
            example: false
        - name: issuing_date_from
          in: query
          required: false
          description: Issuing date from.
          schema:
            type: string
            description: Issuing date bound.
            example: '2022-04-29'
            format: date
        - name: issuing_date_to
          in: query
          required: false
          description: Issuing date to.
