          style: deepObject
          explode: true
          schema:
            type: object
            description: Metadata key and value pairs to match. An empty value, such as metadata[reference]=, matches customers without that key.
            additionalProperties:
              type: string
        - name: currencies[]
          in: query
          required: false
          description: Currencies.
          schema:
            type: array
            description: Currencies.
            items:
              type: string
              description: Currencies.
              example: example
        - name: countries[]
          in: query
          required: false
          description: Countries.
          schema:
            type: array
            description: Countries.
            items:
              type: string
              description: Countries.
              example: example
        - name: states[]
          in: query
          required: false
          description: States.
          schema:
            type: array
            description: States.
            items:
              type: string
              description: States.
              example: example
        - name: zipcodes[]
          in: query
          required: false
          description: Zipcodes.
          schema:
            type: array
            description: Zipcodes.
            items:
