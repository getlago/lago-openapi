    get:
      tags:
        - billable_metrics
      summary: Retrieve billable metric
      description: |-
        Returns the record without nested relationships unless a supported expansion is requested.
        Requires the product catalog to be enabled and billable_metric read permission on the API key.
      operationId: findBillableMetric
      parameters:
        - name: expands[]
          in: query
          required: false
          description: Relationships to include in this response. Only one expansion level is supported.
          schema:
            type: array
            description: Relationships to include.
            items:
              type: string
              enum:
                - filters
              example: filters
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableMetric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - billable_metrics
      summary: Update billable metric
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.
        When attached to a plan, only the name, description and permitted filter changes can be updated. Changes to locked fields return 422. Filter values referenced by product filters cannot be removed.
        Requires the product catalog to be enabled and billable_metric write permission on the API key.
      operationId: updateBillableMetric
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillableMetricUpdateInput'
      responses:
        '200':
          description: Successful response
          headers:
            X-Lago-Endpoint-Status:
              $ref: '#/components/headers/EndpointStatus'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableMetric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
        - billable_metrics
      summary: Update billable metric
      description: |-
        PUT and PATCH both accept partial updates. Omitted fields are unchanged.
        When attached to a plan, only the name, description and permitted filter changes can be updated. Changes to locked fields return 422. Filter values referenced by product filters cannot be removed.
        Requires the product catalog to be enabled and billable_metric write permission on the API key.
      operationId: patchBillableMetric
      requestBody:
        required: true
        description: Request payload
        content:
          application/json:
            schema:
