      summary: Delete rate phase
      description: |-
        Removes the phase and renumbers later positions. The final indefinite phase cannot be removed when that would leave an invalid sequence.
        Requires the product catalog to be enabled and contract_rate_card write permission on the API key.
      operationId: destroyContractRatePhase
