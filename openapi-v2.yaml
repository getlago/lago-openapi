          type:
            - string
            - 'null'
          description: Expiry of the XML URL. Null when no XML URL is available.
          example: null
          format: date-time
        created_at:
          type: string
          description: UTC creation timestamp, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        updated_at:
          type: string
          description: UTC timestamp of the last update, with microsecond precision.
          example: '2022-04-29T08:59:51.123456Z'
          format: date-time
        payment:
          $ref: '#/components/schemas/PaymentObject'
          description: Present only with expands[]=payment on retrieval.
